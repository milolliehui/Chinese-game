<html lang="zh-HK">
<head>
  <meta charset="UTF-8">

  <title>中文島 - 冒險學習 2.0</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <style>
/* Base layout and structural styles for Educational Game Engine */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  font-family: var(--theme-font, -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang HK", "Microsoft YaHei", sans-serif);
  background: var(--theme-bg, #2b2b2b);
  color: var(--theme-text, #1e1e1e);
  height: 100vh;
  overflow: hidden;
  margin: 0;
  padding: 0;
}

#game-app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 920px;
  margin: 0 auto;
  padding: max(env(safe-area-inset-top, 0px) + 16px, 44px) 12px max(env(safe-area-inset-bottom, 0px), 12px) 12px;
}

/* Header & HUD */
.game-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: var(--theme-panel-bg, #eee);
  border: var(--theme-border-width, 3px) solid var(--theme-border-color, #000);
  box-shadow: var(--theme-panel-shadow, none);
  margin-bottom: 8px;
  border-radius: var(--theme-radius, 0px);
}

.hud-left, .hud-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-title {
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: 0.5px;
}

.hud-badge {
  background: var(--theme-badge-bg, #222);
  color: var(--theme-badge-color, #17dd62);
  font-size: 1.1rem;
  font-weight: bold;
  padding: 4px 10px;
  border: var(--theme-border-width, 2px) solid var(--theme-border-color, #000);
  border-radius: var(--theme-radius-sm, 0px);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.hud-btn {
  background: var(--theme-btn-bg, #b88746);
  color: var(--theme-btn-color, #fff);
  font-size: 0.9rem;
  font-weight: bold;
  padding: 6px 10px;
  border: var(--theme-border-width, 3px) solid var(--theme-border-color, #000);
  box-shadow: var(--theme-btn-shadow, none);
  cursor: pointer;
  border-radius: var(--theme-radius-sm, 0px);
  transition: transform 0.08s ease, filter 0.08s ease;
}

.hud-btn:active {
  transform: translate(2px, 2px);
  filter: brightness(0.92);
}

.hud-btn.primary {
  background: var(--theme-btn-primary-bg, #5c8e32);
}

/* Level Select in HUD */
.level-select {
  font-size: 0.95rem;
  font-weight: bold;
  padding: 4px 6px;
  border: var(--theme-border-width, 2px) solid var(--theme-border-color, #000);
  background: #fff;
  border-radius: var(--theme-radius-sm, 0px);
  max-width: 170px;
}

/* Tab Navigation */
.game-nav {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.nav-tab {
  flex: 1;
  padding: 10px 4px;
  font-size: 1rem;
  font-weight: bold;
  border: var(--theme-border-width, 3px) solid var(--theme-border-color, #000);
  background: var(--theme-tab-inactive-bg, #999);
  color: var(--theme-tab-inactive-color, #333);
  cursor: pointer;
  text-align: center;
  border-radius: var(--theme-radius-sm, 0px);
  transition: background 0.12s ease;
}

.nav-tab.active {
  background: var(--theme-tab-active-bg, #5c8e32);
  color: var(--theme-tab-active-color, #fff);
}

/* Stage & Container */
.game-stage {
  flex: 1;
  overflow-y: auto;
  position: relative;
}

.game-module-card {
  background: var(--theme-panel-bg, #c6c6c6);
  border: var(--theme-border-width, 4px) solid var(--theme-border-color, #000);
  box-shadow: var(--theme-panel-shadow, none);
  padding: 14px;
  border-radius: var(--theme-radius, 0px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Module 1: Recognition & Sentence Box */
.sentence-container {
  background: var(--theme-box-bg, #e0e0e0);
  border: var(--theme-border-width, 3px) solid var(--theme-border-color, #000);
  padding: 14px;
  font-size: 1.45rem;
  font-weight: bold;
  line-height: 1.6;
  border-radius: var(--theme-radius-sm, 0px);
}

.target-blank {
  color: var(--theme-accent, #0b8043);
  background: #c8e6c9;
  padding: 2px 8px;
  border: 2px dashed var(--theme-accent, #0b8043);
  border-radius: 4px;
  display: inline-block;
  min-width: 48px;
  text-align: center;
  transition: background-color 0.15s ease, transform 0.15s ease;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.option-btn {
  min-height: 68px;
  font-size: 2rem;
  font-weight: bold;
  background: #eee;
  border: var(--theme-border-width, 3px) solid var(--theme-border-color, #000);
  box-shadow: var(--theme-btn-shadow, none);
  cursor: pointer;
  border-radius: var(--theme-radius-sm, 0px);
  transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
}

.option-btn:active {
  transform: translate(2px, 2px);
}

.option-btn.correct {
  background: #a5d6a7 !important;
  color: #1b5e20 !important;
  border-color: #1b5e20 !important;
}

.option-btn.wrong {
  background: #ef9a9a !important;
  color: #b71c1c !important;
  opacity: 0.6;
}

/* Karaoke Highlighting on Option Buttons & Target Blank */
.option-btn.story-highlight,
.target-blank.story-highlight {
  background: #ffeb3b !important;
  color: #b71c1c !important;
  font-weight: 900 !important;
  border-color: #d35400 !important;
  box-shadow: 0 0 14px rgba(241, 196, 15, 0.95) !important;
  transform: scale(1.04);
}

/* Module 2: Handwriting Crafting Table */
.handwriting-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.char-info-box {
  background: #ddd;
  border: 2px solid #000;
  padding: 4px 14px;
  text-align: center;
  border-radius: var(--theme-radius-sm, 0px);
}

.char-info-box h2 {
  font-size: 2.3rem;
  color: #1a5fb4;
  line-height: 1.1;
}

.handwriting-canvas-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff;
  border: 3px solid #000;
  margin: 6px auto;
  border-radius: 4px;
  overflow: hidden;
  touch-action: none;
}

/* Module 3: Story & Karaoke Highlighting */
.story-box {
  background: #fbfbfb;
  border: 3px solid #000;
  padding: 14px;
  max-height: 250px;
  overflow-y: auto;
  font-size: 1.25rem;
  line-height: 1.8;
  border-radius: var(--theme-radius-sm, 0px);
}

.story-char-span {
  display: inline;
  transition: background-color 0.12s ease, color 0.12s ease;
  border-radius: 3px;
  padding: 1px 2px;
}

.story-char-span.story-highlight {
  background: #ffeb3b !important;
  color: #b71c1c !important;
  font-weight: 900 !important;
  text-shadow: 0 0 1px #d35400;
  box-shadow: 0 0 8px rgba(241, 196, 15, 0.9);
}

/* AI Socratic Companion Box */
.ai-companion-drawer {
  background: #fff8e1;
  border: 3px solid #f39c12;
  border-radius: 6px;
  padding: 10px 14px;
  margin-top: 10px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  animation: slideUp 0.25s ease-out;
}

.ai-companion-avatar {
  font-size: 1.8rem;
  line-height: 1;
}

.ai-companion-body {
  flex: 1;
}

.ai-companion-title {
  font-size: 0.95rem;
  font-weight: bold;
  color: #d35400;
  margin-bottom: 2px;
}

.ai-companion-text {
  font-size: 1rem;
  color: #333;
  line-height: 1.4;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.65);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background: var(--theme-panel-bg, #c6c6c6);
  border: var(--theme-border-width, 4px) solid #000;
  box-shadow: var(--theme-panel-shadow, none);
  padding: 18px;
  max-width: 500px;
  width: 90%;
  border-radius: var(--theme-radius, 0px);
}

/* Minecraft Voxel Visual Theme Tokens */
:root {
  --theme-name: "minecraft";
  --theme-bg: #866043; /* Minecraft Dirt */
  --theme-panel-bg: #c6c6c6; /* Stone panel */
  --theme-border-color: #000000;
  --theme-border-width: 3px;
  --theme-radius: 0px; /* Crisp voxel corners */
  --theme-radius-sm: 0px;

  --theme-text: #1e1e1e;
  --theme-accent: #17dd62; /* Minecraft Emerald */
  --theme-wood: #b88746;
  --theme-grass: #5c8e32;

  --theme-panel-shadow: inset -4px -4px #555, inset 4px 4px #fff;
  --theme-box-bg: #e0e0e0;

  --theme-btn-bg: var(--theme-wood);
  --theme-btn-color: #ffffff;
  --theme-btn-shadow: inset -3px -3px #8c5e26, inset 3px 3px #d69f58;
  --theme-btn-primary-bg: var(--theme-grass);

  --theme-badge-bg: #222222;
  --theme-badge-color: var(--theme-accent);

  --theme-tab-inactive-bg: #888888;
  --theme-tab-inactive-color: #ffffff;
  --theme-tab-active-bg: var(--theme-grass);
  --theme-tab-active-color: #ffffff;

  --theme-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang HK", "Microsoft YaHei", sans-serif;
}

/* Space Explorer Theme Tokens (Example Swappable Skin) */
:root[data-theme="space"] {
  --theme-name: "space";
  --theme-bg: #0b0f19; /* Deep Space */
  --theme-panel-bg: #151d30; /* Cosmic Panel */
  --theme-border-color: #3b82f6;
  --theme-border-width: 2px;
  --theme-radius: 8px; /* Modern rounded corners */
  --theme-radius-sm: 6px;

  --theme-text: #e2e8f0;
  --theme-accent: #38bdf8; /* Cyan star pulse */
  --theme-wood: #2563eb;
  --theme-grass: #06b6d4;

  --theme-panel-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(59, 130, 246, 0.2);
  --theme-box-bg: #1e293b;

  --theme-btn-bg: #1e3a8a;
  --theme-btn-color: #ffffff;
  --theme-btn-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
  --theme-btn-primary-bg: #0284c7;

  --theme-badge-bg: #0f172a;
  --theme-badge-color: #38bdf8;

  --theme-tab-inactive-bg: #334155;
  --theme-tab-inactive-color: #94a3b8;
  --theme-tab-active-bg: #2563eb;
  --theme-tab-active-color: #ffffff;
}

</style>

  <div id="game-app">
    <!-- Header HUD -->
    <header class="game-hud">
      <div class="hud-left">

        <button class="hud-btn" id="btn-sync-cloud" title="同步雲端題庫與作答">☁️</button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="game-nav">
      <button class="nav-tab active" data-module="recognition">⛏️ 礦洞選字</button>

        <button class="hud-btn primary" id="btn-modal-save">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- Cloud Sync Status Modal -->
  <div class="modal-overlay" id="sync-modal">
    <div class="modal-content" style="max-width: 480px; width: 90%;">
      <h3 style="font-size:1.3rem; margin-bottom:10px;">☁️ 雲端題庫與同步設定</h3>
      <p id="sync-status-msg" style="font-size:0.95rem; margin-bottom:14px; line-height:1.5;">正在檢查雲端連線...</p>

      <div style="margin: 12px 0; text-align: left; background: var(--theme-box-bg, #e0e0e0); padding: 10px; border: 2px solid #000; border-radius: 4px;">

        <p style="font-size:0.75rem; color:#666; margin-top:4px;">若您部署了新的 Apps Script，可直接在此貼上並儲存。</p>
      </div>

      <div style="display:flex; justify-content:space-between; gap:8px; margin-top:14px;">
        <button class="hud-btn" id="btn-save-webapp-url">儲存網址並重試</button>
        <button class="hud-btn primary" id="btn-sync-close">確定</button>
      </div>
    </div>
  </div>

  <!-- Load Scripts -->

/**
 * Chinese Game 2.0 - Data Adapter
 * Bridges the frontend engine with Google Sheets / Apps Script Web App and local caching.
 * Hardened with safeStorage to prevent DOMException crashes in restricted storage runtimes.
 */

(function(window) {
  'use strict';

  const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwn7Lf8a2x0U-EHnLb5e5uMtIVtfSRsd_VZla7IbFxLpYFzq8u-A2YUrimdLGtywPOd/exec';

  const memoryStore = {};
  const safeStorage = {
    getItem(key, fallback = null) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? val : (memoryStore[key] !== undefined ? memoryStore[key] : fallback);
      } catch (e) {
        return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
      }
    },
    setItem(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        memoryStore[key] = String(value);
      }
    }
  };

  class DataAdapter {
    constructor() {
      this.webAppUrl = safeStorage.getItem('cg_webapp_url', DEFAULT_WEB_APP_URL);
    }

    setWebAppUrl(url) {
      if (url) {
        this.webAppUrl = url.trim();
        safeStorage.setItem('cg_webapp_url', this.webAppUrl);
      }
    }

    getLevels(child) {
      const childKey = (child || 'milo').toLowerCase();
      try {
        const cached = safeStorage.getItem(`cg_cloud_bank_${childKey}`);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && Array.isArray(parsed.levels) && parsed.levels.length > 0) {
            return parsed.levels;
          }
        }
      } catch (e) {
        console.warn('Failed reading cloud cache, using default banks:', e);
      }

      // Fallback to default hardcoded bank
      if (window.DEFAULT_BANKS && window.DEFAULT_BANKS[childKey]) {
        return window.DEFAULT_BANKS[childKey].levels || [];
      }
      return [];
    }

    async fetchCloudQuestions(child, onSuccess, onError) {
      const childKey = (child || 'milo').toLowerCase();
      if (!this.webAppUrl) {
        if (onError) onError('No WebApp URL configured');
        return;
      }

      const fetchUrl = `${this.webAppUrl}?action=getQuestions&child=${childKey}&t=${Date.now()}`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);

        const resp = await fetch(fetchUrl, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (resp.ok) {
          const data = await resp.json();
          if (data && data.levels && data.levels.length > 0) {
            safeStorage.setItem(`cg_cloud_bank_${childKey}`, JSON.stringify(data));
            if (onSuccess) onSuccess(data.levels);
            return;
          }
        }
        throw new Error('Invalid response structure');
      } catch (err) {
        console.warn('Direct fetch failed, falling back to JSONP:', err);
        this.fetchWithJSONP(childKey, onSuccess, onError);
      }
    }

    fetchWithJSONP(childKey, onSuccess, onError) {
      const cbName = `cg_cb_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
      const script = document.createElement('script');

      let timer = setTimeout(() => {
        cleanup();
        if (onError) onError('JSONP Timeout');
      }, 7000);

      const cleanup = () => {
        if (timer) clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      window[cbName] = (data) => {
        cleanup();
        if (data && data.levels && data.levels.length > 0) {
          safeStorage.setItem(`cg_cloud_bank_${childKey}`, JSON.stringify(data));
          if (onSuccess) onSuccess(data.levels);
        } else if (onError) {
          const detail = (data && (data.message || data.error)) ? (data.message || JSON.stringify(data.error)) : 'Empty levels from JSONP';
          onError(detail);
        }
      };

      script.src = `${this.webAppUrl}?action=getQuestions&child=${childKey}&callback=${cbName}&t=${Date.now()}`;
      script.onerror = () => {
        cleanup();
        if (onError) onError('JSONP network error');
      };
      document.head.appendChild(script);
    }

    logRecord(record) {
      const queue = this.getOfflineQueue();
      queue.push(record);
      this.saveOfflineQueue(queue);

      this.flushOfflineQueue();
    }

    getOfflineQueue() {
      try {
        const val = safeStorage.getItem('cg_offline_records');
        return val ? JSON.parse(val) : [];
      } catch (e) {
        return [];
      }
    }

    saveOfflineQueue(queue) {
      try {
        safeStorage.setItem('cg_offline_records', JSON.stringify(queue));
      } catch (e) {}
    }

    async flushOfflineQueue() {
      const queue = this.getOfflineQueue();
      if (!queue.length || !this.webAppUrl) return;

      const recordToSync = queue[0];
      try {
        await fetch(this.webAppUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(recordToSync)
        });

        // Remove sent record
        queue.shift();
        this.saveOfflineQueue(queue);

        // Continue sending if more exist
        if (queue.length > 0) {
          setTimeout(() => this.flushOfflineQueue(), 300);
        }
      } catch (e) {
        console.warn('Offline flush postponed:', e);
      }
    }
  }

  window.DataAdapter = new DataAdapter();
})(window);

    switchModule(id) {
      if (!this.modules[id]) return;

      // Clean up previous active module lifecycle
      if (this.activeModuleId && this.modules[this.activeModuleId]?.cleanup) {
        this.modules[this.activeModuleId].cleanup();
      }

      this.cancelSpeech();
      this.hideSocraticHint();

      this.activeModuleId = id;

      // Update Nav UI
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.module === id);
      });

      const stage = document.getElementById('game-stage');
      if (stage) {
        stage.innerHTML = '';
        const currentLevel = this.getCurrentLevel();
        this.modules[id].render(stage, currentLevel);
      }
    }

    loadLevels(levels) {
      if (!levels || levels.length === 0) {
        this.levels = [];
        this.currentLevelIndex = 0;
        this.renderLevelDropdown();
        return;
      }

      // 自動將關卡按照日期由新到舊排序，保證最新發布的題目永遠排在第一位 (Index 0)
      this.levels = [...levels].sort((a, b) => {
        const dateA = a.date || '';
        const dateB = b.date || '';
        if (dateB !== dateA) {
          return dateB.localeCompare(dateA); // 日期較新者在前
        }
        const idA = a.levelId || '';
        const idB = b.levelId || '';
        return idB.localeCompare(idA); // 編號較大者在前
      });

      // 每次開啟遊戲或載入題庫時，預設自動選取最新關卡 (Index 0)
      this.currentLevelIndex = 0;
      this.renderLevelDropdown();
      if (this.activeModuleId && this.modules[this.activeModuleId]) {
        this.switchModule(this.activeModuleId);
      }
    }

    getCurrentLevel() {
      if (this.levels.length === 0) return null;
      return this.levels[this.currentLevelIndex] || this.levels[0];
    }

    selectLevel(index) {
      if (this.activeModuleId && this.modules[this.activeModuleId]?.cleanup) {
        this.modules[this.activeModuleId].cleanup();
      }
      this.currentLevelIndex = Math.max(0, Math.min(index, this.levels.length - 1));
      this.hideSocraticHint();
      if (this.activeModuleId) {
        this.switchModule(this.activeModuleId);
      }
    }

    renderLevelDropdown() {
      const select = document.getElementById('level-select');
      if (!select) return;
      select.innerHTML = '';
      this.levels.forEach((lvl, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        const tag = (idx === 0) ? ' ★ 最新' : '';
        opt.textContent = `${lvl.date || ''} ${lvl.theme || '關卡' + (idx + 1)}${tag}`;
        select.appendChild(opt);
      });
      select.value = this.currentLevelIndex;
    }

    showToast(message, duration = 2500) {
      let toast = document.getElementById('engine-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'engine-toast';
        toast.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:6px; font-size:0.95rem; font-weight:bold; z-index:99999; box-shadow:0 4px 14px rgba(0,0,0,0.4); border:2px solid #5c8e32; pointer-events:none; transition:opacity 0.25s ease; opacity:0;';
        document.body.appendChild(toast);

      toast.textContent = message;
      toast.style.opacity = '1';

        toast.style.opacity = '0';

    updateHUD() {
      const childBtn = document.getElementById('btn-switch-child');
      if (childBtn) {
        childBtn.textContent = this.activeChild === 'milo' ? '👦 Milo ⇄' : '👦 Ollie ⇄';
      }
      const titleEl = document.getElementById('app-title');
      if (titleEl) {
        titleEl.textContent = this.activeChild === 'milo' ? 'Milo 中文島' : 'Ollie 中文島';
      }
      const emeraldEl = document.getElementById('emerald-count');
      if (emeraldEl) {
        emeraldEl.textContent = `💎 ${this.state.emeralds[this.activeChild] || 0}`;
      }
      const langBtn = document.getElementById('btn-toggle-lang');
      if (langBtn) {
        langBtn.textContent = this.getSpeechDialectLabel();
      }
    }

    // Socratic AI Companion Hook
    triggerSocraticHint(context) {
      const drawer = document.getElementById('ai-companion-drawer');
      if (!drawer) return;
      
      const titleEl = drawer.querySelector('.ai-companion-title');
      const textEl = drawer.querySelector('.ai-companion-text');

      titleEl.textContent = `💡 AI 小幫手的提點 (${context.char || context.target || '字詞啟發'})`;
      textEl.textContent = context.hint || '試著觀察部首的形狀和意思，想一想它和哪個部首有關聯喔！';

      drawer.style.display = 'flex';
      this.playTone(440, 0.15); // Friendly chime
    }

    hideSocraticHint() {
      const drawer = document.getElementById('ai-companion-drawer');
      if (drawer) drawer.style.display = 'none';
    }

    // Answer logging to Google Sheets via DataAdapter
    recordAnswer(record) {
      const fullRecord = {
        timestamp: new Date().toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' }),
        child: this.activeChild === 'milo' ? 'Milo' : 'Ollie',
        levelId: this.getCurrentLevel()?.levelId || 'lvl',
        ...record
      };
      if (window.DataAdapter) {
        window.DataAdapter.logRecord(fullRecord);
      }
    }
  }

  window.GameEngine = GameEngine;
})(window);

/**
 * Module 1: 礦洞選字 (Word Recognition & Sentence Fill-in)
 * Pluggable activity module.

 */

(function(window) {
  'use strict';

  class RecognitionModule {
    constructor() {
      this.currentIndex = 0;
      this.questions = [];
      this.attempts = 0;
      this.isProcessing = false;
      this.isReadingPrompt = false;
      this.promptFallbackTimer = null;
      this.confirmFallbackTimer = null;
    }

    render(container, levelData) {
      this.cleanup();
      this.container = container;
      this.questions = levelData?.recognition || [];
      this.currentIndex = 0;
      this.renderQuestion();
    }

    cleanup() {
      this.stopQuestionRead();
      if (this.confirmFallbackTimer) {
        clearInterval(this.confirmFallbackTimer);
        this.confirmFallbackTimer = null;
      }
      this.clearAllHighlights();
      this.isProcessing = false;
    }

    clearAllHighlights() {
      const els = document.querySelectorAll('.story-highlight');
      els.forEach(el => el.classList.remove('story-highlight'));

      const options = [...q.options];
      for (let i = options.length - 1; i > 0; i--) {

        [options[i], options[j]] = [options[j], options[i]];
      }

      let charIdx = 0;

      if (blankIndex !== -1) {

        const after = q.sentence.slice(blankIndex + 4);
        for (const ch of before) {
          sentenceHtml += `<span id="rec-char-${charIdx}" class="story-char-span">${ch}</span>`;
          charIdx++;
        }
        sentenceHtml += `<span id="target-blank" class="target-blank">？</span>`;
        for (const ch of after) {
          sentenceHtml += `<span id="rec-char-${charIdx}" class="story-char-span">${ch}</span>`;
          charIdx++;
        }
      } else {
        for (const ch of q.sentence) {
          sentenceHtml += `<span id="rec-char-${charIdx}" class="story-char-span">${ch}</span>`;
          charIdx++;
        }
      }

      this.container.innerHTML = `
        <div class="game-module-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
            <span class="hud-badge" style="font-size:0.95rem;">⛏️ 礦洞選字 第 ${this.currentIndex + 1} / ${this.questions.length} 題</span>
            <div style="display:flex; gap:6px; align-items:center;">
              <span style="font-size:0.85rem; color:#555;">提示: ${q.hint || '請選出正確的字'}</span>
              <button class="hud-btn" id="btn-read-rec-q" style="font-size:0.85rem; padding:4px 8px;">🔊 朗讀題目與選項</button>
              <button class="hud-btn" id="btn-stop-rec-q" style="font-size:0.85rem; padding:4px 8px; display:none;">⏹️ 停止</button>
            </div>
          </div>

          <div class="sentence-container" id="sentence-box">
            ${sentenceHtml}
          </div>

          <div class="options-grid" id="options-grid">
            ${options.map((opt, oIdx) => `
              <button class="option-btn" id="rec-opt-${oIdx}" data-val="${opt}">${opt}</button>
            `).join('')}
          </div>

          <div id="ai-companion-drawer" class="ai-companion-drawer" style="display:none;">
            <div class="ai-companion-avatar">🦉</div>
            <div class="ai-companion-body">
              <div class="ai-companion-title">AI 小幫手提點</div>
              <div class="ai-companion-text"></div>
            </div>
          </div>
        </div>
      `;

      // Read question & options audio button
      const readBtn = document.getElementById('btn-read-rec-q');
      const stopBtn = document.getElementById('btn-stop-rec-q');

      readBtn.addEventListener('click', () => {
        this.startQuestionRead(q, options, readBtn, stopBtn);
      });

      stopBtn.addEventListener('click', () => {
        this.stopQuestionRead(readBtn, stopBtn);
      });

      // Bind option button events
      const btns = this.container.querySelectorAll('.option-btn');
      btns.forEach(btn => {
        btn.addEventListener('click', () => {

    startQuestionRead(q, options, readBtn, stopBtn) {
      if (!('speechSynthesis' in window)) return;
      this.engine.cancelSpeech();

      if (readBtn) readBtn.style.display = 'none';
      if (stopBtn) stopBtn.style.display = 'inline-block';

      // Build spoken text and character index map
      let spokenText = '';
      const spanMap = [];
      let cIdx = 0;
      const blankIndex = q.sentence.indexOf('［  ］');

      if (blankIndex !== -1) {
        const before = q.sentence.slice(0, blankIndex);
        const after = q.sentence.slice(blankIndex + 4);
        for (const ch of before) {
          spokenText += ch;
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
        // Blank spoken as '什麼'
        spokenText += '什麼';
        spanMap.push('target-blank');
        spanMap.push('target-blank');
        for (const ch of after) {
          spokenText += ch;
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
      } else {
        for (const ch of q.sentence) {
          spokenText += ch;
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
      }

      spokenText += '。選項有：';
      for (let i = 0; i < 5; i++) spanMap.push(null);

      options.forEach((opt, oIdx) => {
        if (oIdx > 0) {
          spokenText += '、';
          spanMap.push(null);
        }
        for (const ch of opt) {
          spokenText += ch;
          spanMap.push(`rec-opt-${oIdx}`);
        }
      });
      spokenText += '。';
      spanMap.push(null);

      const highlightElement = (targetId) => {
        this.clearAllHighlights();
        if (!targetId) return;
        const el = document.getElementById(targetId);
        if (el) {
          el.classList.add('story-highlight');
          if (el.scrollIntoView) {
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }

      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = this.engine.speechLang;
      utterance.rate = 0.85;

      let boundaryFired = false;
      let timerIdx = 0;

      utterance.onboundary = (e) => {
        boundaryFired = true;
        if (this.promptFallbackTimer) {
          clearInterval(this.promptFallbackTimer);
          this.promptFallbackTimer = null;
        }
        if (e.charIndex !== undefined && spanMap[e.charIndex] !== undefined) {
          highlightElement(spanMap[e.charIndex]);
        }
      };

      // iOS WebKit Fallback timer
      this.promptFallbackTimer = setInterval(() => {
        if (boundaryFired) {
          clearInterval(this.promptFallbackTimer);
          return;
        }
        if (timerIdx < spanMap.length) {
          highlightElement(spanMap[timerIdx]);
          timerIdx++;
        } else {
          clearInterval(this.promptFallbackTimer);
        }
      }, 310);

      const onFinish = () => {
        this.stopQuestionRead(readBtn, stopBtn);

      utterance.onerror = onFinish;

      const rBtn = readBtn || document.getElementById('btn-read-rec-q');
      const sBtn = stopBtn || document.getElementById('btn-stop-rec-q');
      if (rBtn) rBtn.style.display = 'inline-block';
      if (sBtn) sBtn.style.display = 'none';
    }

    handleAnswer(selected, btnEl, q) {
      if (this.isProcessing) return;

      this.attempts++;
      const isCorrect = (selected === q.answer);

      if (isCorrect) {
        this.isProcessing = true;
        this.clearAllHighlights();
        btnEl.classList.add('correct');
        this.engine.playSuccessSound();

        const blank = document.getElementById('target-blank');
        if (blank) {
          blank.textContent = q.answer;
          blank.style.background = '#a5d6a7';
          blank.style.borderColor = '#2e7d32';
        }

        // Award emeralds
        const emeralds = (this.attempts === 1) ? 1 : 0.5;
        this.engine.addEmeralds(emeralds);

        // Record answer
        this.engine.recordAnswer({
          module: '礦洞選字',
          question: q.sentence,
          userAnswer: selected,
          correctAnswer: q.answer,
          result: this.attempts === 1 ? '第一次答對' : '第二次答對',
          attempts: this.attempts,
          emerald: emeralds,
          weakTag: '✅ 已掌握'
        });

        this.speakConfirmationSentence(q.sentence, q.answer, () => {

            this.renderQuestion();
          }, 800);
        });

        btnEl.classList.add('wrong');
        btnEl.disabled = true;
        this.engine.playErrorSound();

        if (this.attempts >= 2) {
          this.isProcessing = true;

          this.engine.triggerSocraticHint({
            char: q.answer,
            hint: q.socraticHint || `正確字是「${q.answer}」。注意它的字形與語境：「${q.hint || ''}」！`
          });

          // Reveal answer after 2 attempts
          const blank = document.getElementById('target-blank');
          if (blank) {
            blank.textContent = q.answer;
            blank.style.background = '#ffcdd2';
            blank.style.borderColor = '#c62828';
          }

          this.engine.recordAnswer({
            module: '礦洞選字',
            question: q.sentence,
            userAnswer: selected,
            correctAnswer: q.answer,
            result: '兩次皆錯',
            attempts: this.attempts,
            emerald: 0,
            weakTag: '⚠️ 需加強'
          });

          setTimeout(() => {
            this.speakConfirmationSentence(q.sentence, q.answer, () => {
              setTimeout(() => {
                this.currentIndex++;
                this.renderQuestion();
              }, 800);
            });
          }, 1500);
        }
      }

        for (const ch of before) {
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }

        for (const ch of after) {
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
      } else {

          spanMap.push(`rec-char-${i}`);
        }
      }

      const highlightElement = (targetId) => {
        this.clearAllHighlights();

        const el = document.getElementById(targetId);

            showOutline: true,
            strokeAnimationSpeed: 1.2,
            delayBetweenStrokes: 200,
            drawingWidth: sz / 18,
            radicalColor: '#16a085',
            leniency: 2.2,
            onCorrectStroke: () => {
              this.engine.playTone(600, 0.05);
            },
            onComplete: () => {
              this.isQuizCompleted = true;
              this.engine.playSuccessSound();
              const feedback = document.getElementById('hw-feedback-msg');
              if (feedback) feedback.textContent = '🌟 太棒了！筆順描寫完成，請點擊下方完成按鈕！';
            }
          });
          this.currentWriter.quiz();
          return;
        } catch (e) {
          console.warn('HanziWriter init failed, falling back to local canvas:', e);
        }
      }

      // Offline HTML5 Canvas Fallback
      this.setupOfflineCanvas(container, cur.char, sz);
    }

    setupOfflineCanvas(container, char, sz) {
      this.currentWriter = null;
      const canvas = document.createElement('canvas');
      canvas.width = sz;
      canvas.height = sz;
      container.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      this.offlineDrawingCtx = ctx;

      // Draw rice-grid (米字格)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(sz / 2, 0); ctx.lineTo(sz / 2, sz);
      ctx.moveTo(0, sz / 2); ctx.lineTo(sz, sz / 2);
      ctx.moveTo(0, 0); ctx.lineTo(sz, sz);
      ctx.moveTo(sz, 0); ctx.lineTo(0, sz);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw watermark character outline
      ctx.font = `${sz * 0.75}px 'Kaiti SC', 'STKaiti', serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f0f0f0';
      ctx.fillText(char, sz / 2, sz / 2 + 10);

      // Drawing state
      let isDrawing = false;
      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const start = (e) => {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.strokeStyle = '#1a5fb4';
        ctx.lineWidth = sz / 20;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        this.offlineStrokeCount++;
      };

      const stop = () => { isDrawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stop);
    }

    handleCompleteChar(cur, isCapped, btnEl) {
      if (this.isTransitioning) return;

      const feedback = document.getElementById('hw-feedback-msg');

      // Exploitation prevention gate: Must verify valid writing if not capped
      if (!isCapped) {
        if (this.currentWriter !== null && !this.isQuizCompleted) {
          this.engine.playErrorSound();
          if (feedback) feedback.textContent = '⚠️ 請先依照筆順完成描寫，再點擊領取綠寶石喔！';
          return;
        }
        if (this.currentWriter === null && this.offlineStrokeCount < 5) {
          this.engine.playErrorSound();
          if (feedback) feedback.textContent = '⚠️ 請在米字格上認真描寫漢字後再送出喔！';
          return;
        }
      }

      this.isTransitioning = true;
      btnEl.disabled = true;

      const levelId = this.engine.getCurrentLevel()?.levelId || 'lvl';
      const capKey = `${levelId}_${cur.char}`;
      const earnedCount = this.engine.state.hwEarnedCounts[capKey] || 0;

      if (!isCapped) {
        this.engine.state.hwEarnedCounts[capKey] = earnedCount + 1;
        this.engine.saveState();
        this.engine.addEmeralds(1);

        this.engine.recordAnswer({
          module: '合成台練字',
          question: `書寫漢字【${cur.char}】`,
          userAnswer: cur.char,
          correctAnswer: cur.char,
          result: '第一次答對',
          attempts: 1,
          emerald: 1,
          weakTag: '✅ 已掌握'
        });
      } else {
        this.engine.playSuccessSound();
      }

      this.engine.speakText(cur.char, () => {
        setTimeout(() => {
          this.currentIndex++;
          this.renderChar();
        }, 400);
      });
    }

    renderCompletion() {
      this.container.innerHTML = `
        <div class="game-module-card" style="text-align:center; padding: 24px;">
          <h2 style="font-size:2rem; margin-bottom:12px;">🎉 合成台練字完成！</h2>
          <p style="font-size:1.2rem; margin-bottom:16px;">今日的筆順練習已圓滿達成，字體工整又端正！</p>
          <button class="hud-btn primary" id="btn-next-module-reading" style="font-size:1.2rem; padding:10px 24px;">
            前往「村莊冒險日記」📖
          </button>
        </div>
      `;
      document.getElementById('btn-next-module-reading').addEventListener('click', () => {
        this.engine.switchModule('reading');
      });
    }
  }

  window.HandwritingModule = HandwritingModule;
})(window);

/**
 * Module 3: 村莊冒險日記 (Reading Comprehension & Karaoke Highlighting)
 * Pluggable activity module.
 * Enhanced with synchronized real-time karaoke highlighting for story, QA question, and options.
 */

(function(window) {
  'use strict';

  class ReadingModule {
    constructor() {
      this.storyData = null;
      this.currentQIndex = 0;
      this.isReading = false;
      this.storyFallbackTimer = null;
      this.qaFallbackTimer = null;
      this.attempts = 0;
      this.isProcessing = false;
      this.isReadingQA = false;
    }

    render(container, levelData) {
      this.cleanup();
      this.container = container;
      this.storyData = levelData?.story || null;
      this.currentQIndex = 0;
      this.isReading = false;
      this.isProcessing = false;
      this.isReadingQA = false;
      this.renderView();
    }

    cleanup() {
      if (this.storyFallbackTimer) {
        clearInterval(this.storyFallbackTimer);
        this.storyFallbackTimer = null;
      }
      if (this.qaFallbackTimer) {
        clearInterval(this.qaFallbackTimer);
        this.qaFallbackTimer = null;
      }
      this.isReading = false;
      this.isProcessing = false;
      this.isReadingQA = false;
      this.clearAllHighlights();
    }

    clearAllHighlights() {
      const highlighted = document.querySelectorAll('.story-highlight');
      highlighted.forEach(el => el.classList.remove('story-highlight'));
    }

    renderView() {
      if (!this.storyData) {
        this.container.innerHTML = `<div class="game-module-card"><p>本關卡暫無閱讀篇章。</p></div>`;
        return;
      }

      const storyText = this.storyData.content || '';
      const questions = this.storyData.questions || [];
      const hasQA = questions.length > 0;

      // Wrap each character in span for karaoke highlighting
      let charIndex = 0;
      const wrappedStory = storyText.split('').map(ch => {
        const span = `<span id="story-char-${charIndex}" class="story-char-span">${ch}</span>`;
        charIndex++;
        return span;
      }).join('');

      this.container.innerHTML = `
        <div class="game-module-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="hud-badge" style="font-size:0.95rem;">📖 ${this.storyData.title || '冒險日記'}</span>
            <div style="display:flex; gap:6px;">
              <button class="hud-btn primary" id="btn-read-story">🔊 朗讀故事</button>
              <button class="hud-btn" id="btn-stop-story" style="display:none;">⏹️ 停止</button>
            </div>
          </div>

          <div class="story-box" id="story-text-container">
            ${wrappedStory}
          </div>

          <div id="qa-container" style="margin-top:10px;">
            ${hasQA ? `<div id="qa-active-question"></div>` : `<p style="text-align:center;">閱讀完畢！請點擊上方朗讀跟讀練習。</p>`}
          </div>
        </div>
      `;

      // Story audio buttons
      const readBtn = document.getElementById('btn-read-story');
      const stopBtn = document.getElementById('btn-stop-story');

      readBtn.addEventListener('click', () => {
        this.startKaraokeRead(storyText, readBtn, stopBtn);
      });

      stopBtn.addEventListener('click', () => {
        this.stopKaraokeRead(readBtn, stopBtn);
      });

      if (hasQA) {
        this.renderQAQuestion(questions);
      }
    }

    startKaraokeRead(text, readBtn, stopBtn) {
      if (!('speechSynthesis' in window)) return;
      this.engine.cancelSpeech();
      this.clearAllHighlights();

      this.isReading = true;
      if (readBtn) readBtn.style.display = 'none';
      if (stopBtn) stopBtn.style.display = 'inline-block';

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = this.engine.speechLang;
      utterance.rate = 0.85;

      let boundaryFired = false;
      let timerIdx = 0;

      const highlightChar = (idx) => {
        this.clearAllHighlights();
        const el = document.getElementById(`story-char-${idx}`);
        if (el) {
          el.classList.add('story-highlight');
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      };

      utterance.onboundary = (e) => {
        boundaryFired = true;
        if (this.storyFallbackTimer) {
          clearInterval(this.storyFallbackTimer);
          this.storyFallbackTimer = null;
        }
        if (e.charIndex !== undefined) {
          highlightChar(e.charIndex);
        }
      };

      // iOS WebKit Fallback timer
      this.storyFallbackTimer = setInterval(() => {
        if (boundaryFired) {
          clearInterval(this.storyFallbackTimer);
          return;
        }
        if (timerIdx < text.length) {
          highlightChar(timerIdx);
          timerIdx++;
        } else {
          clearInterval(this.storyFallbackTimer);
        }
      }, 310);

      const onFinish = () => {
        this.stopKaraokeRead(readBtn, stopBtn);
      };

      utterance.onend = onFinish;
      utterance.onerror = onFinish;

      window.speechSynthesis.speak(utterance);
    }

    stopKaraokeRead(readBtn, stopBtn) {
      this.isReading = false;
      if (this.storyFallbackTimer) {
        clearInterval(this.storyFallbackTimer);
        this.storyFallbackTimer = null;
      }
      this.engine.cancelSpeech();
      this.clearAllHighlights();

      if (readBtn) readBtn.style.display = 'inline-block';
      if (stopBtn) stopBtn.style.display = 'none';
    }

    renderQAQuestion(questions) {
      const qaContainer = document.getElementById('qa-active-question');
      if (!qaContainer) return;

      if (this.currentQIndex >= questions.length) {
        qaContainer.innerHTML = `
          <div style="text-align:center; padding: 14px; background:#e8f5e9; border:2px solid #4caf50; border-radius:4px;">
            <h3>🌟 閱讀理解測驗全數通過！</h3>
            <p style="margin-top:4px;">已精熟掌握故事重點與文意脈絡！</p>
          </div>
        `;
        return;
      }

      this.attempts = 0;
      this.isProcessing = false;
      this.isReadingQA = false;
      const q = questions[this.currentQIndex];

      // Wrap question characters in spans for karaoke highlighting
      let qHtml = '';
      for (let i = 0; i < q.question.length; i++) {
        qHtml += `<span id="qa-q-char-${i}" class="story-char-span">${q.question[i]}</span>`;
      }

      // Shuffle options with answer rotation
      const options = [...q.options];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      qaContainer.innerHTML = `
        <div style="background:#f0f0f0; border:2px solid #000; padding:10px; border-radius:4px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px;">
            <div style="font-weight:bold; font-size:1.15rem;">
              ❓ 問題 ${this.currentQIndex + 1} / ${questions.length}: ${qHtml}
            </div>
            <div style="display:flex; gap:6px;">
              <button class="hud-btn" id="btn-read-qa-q" style="font-size:0.85rem; padding:4px 8px;">🔊 朗讀問題與選項</button>
              <button class="hud-btn" id="btn-stop-qa-q" style="font-size:0.85rem; padding:4px 8px; display:none;">⏹️ 停止</button>
            </div>
          </div>
          <div class="options-grid">
            ${options.map((opt, oIdx) => `
              <button class="option-btn qa-opt-btn" id="qa-opt-${oIdx}" data-val="${opt}" style="font-size:1.15rem; min-height:50px;">
                ${opt}
              </button>
            `).join('')}
          </div>
        </div>
      `;

      // Read QA audio buttons
      const readQABtn = document.getElementById('btn-read-qa-q');
      const stopQABtn = document.getElementById('btn-stop-qa-q');

      readQABtn.addEventListener('click', () => {
        this.startQAQuestionRead(q, options, readQABtn, stopQABtn);
      });

      stopQABtn.addEventListener('click', () => {
        this.stopQAQuestionRead(readQABtn, stopQABtn);
      });

      qaContainer.querySelectorAll('.qa-opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          this.stopQAQuestionRead(readQABtn, stopQABtn);
          this.handleQAAnswer(btn.dataset.val, btn, q, questions);
        });
      });
    }

    startQAQuestionRead(q, options, readBtn, stopBtn) {
      if (!('speechSynthesis' in window)) return;
      this.engine.cancelSpeech();
      this.clearAllHighlights();

      this.isReadingQA = true;
      if (readBtn) readBtn.style.display = 'none';
      if (stopBtn) stopBtn.style.display = 'inline-block';

      // Build spoken text and character index map
      let spokenText = '';
      const spanMap = [];

      for (let i = 0; i < q.question.length; i++) {
        spokenText += q.question[i];
        spanMap.push(`qa-q-char-${i}`);
      }

      spokenText += '。選項有：';
      for (let i = 0; i < 5; i++) spanMap.push(null);

      options.forEach((opt, oIdx) => {
        if (oIdx > 0) {
          spokenText += '；';
          spanMap.push(null);
        }
        for (const ch of opt) {
          spokenText += ch;
          spanMap.push(`qa-opt-${oIdx}`);
        }
      });
      spokenText += '。';
      spanMap.push(null);

      const highlightElement = (targetId) => {
        this.clearAllHighlights();
        if (!targetId) return;
        const el = document.getElementById(targetId);
        if (el) {
          el.classList.add('story-highlight');
          if (el.scrollIntoView) {
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }
      };

      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = this.engine.speechLang;
      utterance.rate = 0.85;

      let boundaryFired = false;
      let timerIdx = 0;

      utterance.onboundary = (e) => {
        boundaryFired = true;
        if (this.qaFallbackTimer) {
          clearInterval(this.qaFallbackTimer);
          this.qaFallbackTimer = null;
        }
        if (e.charIndex !== undefined && spanMap[e.charIndex] !== undefined) {
          highlightElement(spanMap[e.charIndex]);
        }
      };

      // iOS WebKit Fallback timer
      this.qaFallbackTimer = setInterval(() => {
        if (boundaryFired) {
          clearInterval(this.qaFallbackTimer);
          return;
        }
        if (timerIdx < spanMap.length) {
          highlightElement(spanMap[timerIdx]);
          timerIdx++;
        } else {
          clearInterval(this.qaFallbackTimer);
        }
      }, 310);

      const onFinish = () => {
        this.stopQAQuestionRead(readBtn, stopBtn);
      };

      utterance.onend = onFinish;
      utterance.onerror = onFinish;

      window.speechSynthesis.speak(utterance);
    }

    stopQAQuestionRead(readBtn, stopBtn) {
      this.isReadingQA = false;
      if (this.qaFallbackTimer) {
        clearInterval(this.qaFallbackTimer);
        this.qaFallbackTimer = null;
      }
      this.engine.cancelSpeech();
      this.clearAllHighlights();

      const rBtn = readBtn || document.getElementById('btn-read-qa-q');
      const sBtn = stopBtn || document.getElementById('btn-stop-qa-q');
      if (rBtn) rBtn.style.display = 'inline-block';
      if (sBtn) sBtn.style.display = 'none';
    }

    handleQAAnswer(selected, btnEl, q, questions) {
      if (this.isProcessing) return;

      this.attempts++;
      const isCorrect = (selected === q.answer);

      if (isCorrect) {
        this.isProcessing = true;
        this.clearAllHighlights();
        // Disable all buttons immediately to prevent duplicate clicks
        const allBtns = this.container.querySelectorAll('.qa-opt-btn');
        allBtns.forEach(b => b.disabled = true);

        btnEl.classList.add('correct');
        this.engine.playSuccessSound();

        const emeralds = (this.attempts === 1) ? 1 : 0.5;
        this.engine.addEmeralds(emeralds);

        this.engine.recordAnswer({
          module: '冒險日記',
          question: q.question,
          userAnswer: selected,
          correctAnswer: q.answer,
          result: this.attempts === 1 ? '第一次答對' : '第二次答對',
          attempts: this.attempts,
          emerald: emeralds,
          weakTag: '✅ 已掌握'
        });

        setTimeout(() => {
          this.currentQIndex++;
          this.renderQAQuestion(questions);
        }, 800);

      } else {
        btnEl.classList.add('wrong');
        btnEl.disabled = true;
        this.engine.playErrorSound();

        if (this.attempts >= 2) {
          this.isProcessing = true;
          this.clearAllHighlights();
          const allBtns = this.container.querySelectorAll('.qa-opt-btn');
          allBtns.forEach(b => b.disabled = true);

          this.engine.triggerSocraticHint({
            char: '閱讀理解',
            hint: `答案在故事裡哦！試著重讀故事找出關於「${q.question}」的描寫！`
          });

          this.engine.recordAnswer({
            module: '冒險日記',
            question: q.question,
            userAnswer: selected,
            correctAnswer: q.answer,
            result: '兩次皆錯',
            attempts: this.attempts,
            emerald: 0,
            weakTag: '⚠️ 需加強'
          });

          setTimeout(() => {
            this.currentQIndex++;
            this.renderQAQuestion(questions);
          }, 1600);
        }
      }
    }
  }

  window.ReadingModule = ReadingModule;
})(window);

</script>
  
  
  
  
  

  <!-- Application Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Initialize Engine
      const engine = new window.GameEngine();
      window.engine = engine;

      // 2. Register Activity Modules
      engine.registerModule('recognition', new window.RecognitionModule());
      engine.registerModule('handwriting', new window.HandwritingModule());
      engine.registerModule('reading', new window.ReadingModule());

      // 3. Load Questions from DataAdapter
      const levels = window.DataAdapter.getLevels(engine.activeChild);
      engine.loadLevels(levels);
      engine.switchModule('recognition');
      engine.updateHUD();

      // 4. Background Cloud Update Attempt
      window.DataAdapter.fetchCloudQuestions(engine.activeChild, (newLevels) => {
        console.log('Successfully fetched fresh questions from cloud:', newLevels);
        engine.loadLevels(newLevels);
        engine.showToast && engine.showToast('☁️ 已自動同步並跳轉至今日最新關卡！');
      }, (err) => {
        console.log('Using cached/offline questions:', err);
      });

      // 5. Wire Event Handlers
      // Profile Switch
      document.getElementById('btn-switch-child').addEventListener('click', () => {
        const next = engine.activeChild === 'milo' ? 'ollie' : 'milo';
        engine.setChild(next);
      });

      // Dialect Toggle (Mandarin / Cantonese)
      document.getElementById('btn-toggle-lang').addEventListener('click', () => {
        engine.toggleSpeechDialect();
      });

      // Level Dropdown
      document.getElementById('level-select').addEventListener('change', (e) => {
        engine.selectLevel(parseInt(e.target.value, 10));
      });

      // Navigation Tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          engine.switchModule(tab.dataset.module);
        });
      });

      // Cloud Sync Button
      const syncModal = document.getElementById('sync-modal');
      const syncMsg = document.getElementById('sync-status-msg');
      const webAppInput = document.getElementById('input-webapp-url');

      const triggerSync = () => {
        syncMsg.textContent = '正在自 Google Drive / 試算表拉取最新關卡...';
        window.DataAdapter.fetchCloudQuestions(engine.activeChild, (newLevels) => {
          engine.loadLevels(newLevels);
          syncMsg.textContent = `✅ 同步成功！已載入 ${newLevels.length} 個最新關卡。`;
          window.DataAdapter.flushOfflineQueue();
        }, (err) => {
          syncMsg.textContent = `ℹ️ 目前使用本機離線題庫 (${err})。作答紀錄已在背景暫存，稍後聯網將自動同步。`;
        });
      };

      document.getElementById('btn-sync-cloud').addEventListener('click', () => {
        if (webAppInput) webAppInput.value = window.DataAdapter.webAppUrl || '';
        syncModal.classList.add('active');
        triggerSync();
      });

      document.getElementById('btn-save-webapp-url').addEventListener('click', () => {
        if (webAppInput && webAppInput.value.trim()) {
          window.DataAdapter.setWebAppUrl(webAppInput.value.trim());
          triggerSync();
        }
      });

      document.getElementById('btn-sync-close').addEventListener('click', () => {
        syncModal.classList.remove('active');
      });

      // Parent Emerald Modal
      const parentModal = document.getElementById('parent-modal');
      document.getElementById('emerald-count').addEventListener('click', () => {
        document.getElementById('input-emerald').value = engine.state.emeralds[engine.activeChild] || 0;
        parentModal.classList.add('active');
      });

      document.getElementById('btn-modal-cancel').addEventListener('click', () => {
        parentModal.classList.remove('active');
      });

      document.getElementById('btn-modal-save').addEventListener('click', () => {
        const val = parseInt(document.getElementById('input-emerald').value, 10);
        if (!isNaN(val)) {
          engine.state.emeralds[engine.activeChild] = val;
          engine.saveState();
          engine.updateHUD();
        }
        parentModal.classList.remove('active');
      });

      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('Service Worker registration skipped:', err);
        });
      }
    });
  </script>
