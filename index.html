<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Race Master: 中文極速賽車 2.0</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
/* ==========================================================================
   Race Master 3D - High-Octane Educational Game Theme & Layout Engine
   ========================================================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}

:root {
  --theme-name: "racemaster";
  
  /* Backgrounds: Dark Asphalt & Carbon Chassis */
  --theme-bg: #0c0e14;              /* Deep tarmac black */
  --theme-panel-bg: #161a24;        /* Dark carbon chassis */
  --theme-box-bg: #1e2433;          /* Cockpit telemetry card */
  
  /* Borders & Radii */
  --theme-border-color: #2b3345;    /* Titanium seam */
  --theme-border-width: 2px;
  --theme-radius: 12px;             /* Aerodynamic curves */
  --theme-radius-sm: 8px;

  /* Typography */
  --theme-text: #f0f4fc;            /* Crisp cockpit white */
  --theme-text-muted: #8e9bb5;      /* Telemetry secondary gray */
  --theme-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "PingFang HK", "Microsoft YaHei", sans-serif;

  /* High-Octane Neon Accents */
  --theme-accent: #00e5ff;          /* Nitro Cyan */
  --theme-trophy: #ffcc00;          /* Podium Gold */
  --theme-speed: #ff2a5f;           /* Hot Racing Red */
  --theme-nitro: #00ff66;           /* Turbo Lime Green */

  /* Shadows & Depth */
  --theme-panel-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --theme-box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);

  /* Buttons */
  --theme-btn-bg: #262e40;
  --theme-btn-color: #ffffff;
  --theme-btn-shadow: 0 3px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  --theme-btn-primary-bg: #ff2a5f;

  /* HUD & Badges */
  --theme-badge-bg: #080a0f;
  --theme-badge-color: #ffcc00;

  /* Navigation Tabs */
  --theme-tab-inactive-bg: #191e2b;
  --theme-tab-inactive-color: #8e9bb5;
  --theme-tab-active-bg: #00e5ff;
  --theme-tab-active-color: #080a0f;

  /* Option Buttons */
  --theme-btn-option-bg: #222938;
  --theme-btn-option-color: #f0f4fc;
  --theme-btn-option-border: #38435c;
}

body {
  font-family: var(--theme-font);
  background: var(--theme-bg);
  color: var(--theme-text);
  height: 100vh;
  overflow: hidden;
  margin: 0;
  padding: 0;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 100% 100%, 32px 32px, 32px 32px;
}

#game-app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 920px;
  margin: 0 auto;
  padding: max(env(safe-area-inset-top, 0px) + 12px, 40px) 12px max(env(safe-area-inset-bottom, 0px), 12px) 12px;
}

/* Header & HUD */
.game-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: var(--theme-panel-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: var(--theme-panel-shadow);
  margin-bottom: 8px;
  border-radius: var(--theme-radius);
  position: relative;
}

.hud-left, .hud-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-title {
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: var(--theme-accent);
  text-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
  display: flex;
  align-items: center;
  gap: 4px;
}

.hud-badge {
  background: var(--theme-badge-bg);
  color: var(--theme-badge-color);
  font-size: 1.05rem;
  font-weight: 800;
  padding: 4px 10px;
  border: var(--theme-border-width) solid var(--theme-border-color);
  border-radius: var(--theme-radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
}

.hud-btn {
  background: var(--theme-btn-bg);
  color: var(--theme-btn-color);
  font-size: 0.88rem;
  font-weight: 700;
  padding: 6px 10px;
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: var(--theme-btn-shadow);
  cursor: pointer;
  border-radius: var(--theme-radius-sm);
  transition: transform 0.08s ease, filter 0.08s ease, background 0.12s ease;
  white-space: nowrap;
}

.hud-btn:active {
  transform: translate(1px, 2px);
  filter: brightness(1.15);
}

.hud-btn.primary {
  background: var(--theme-btn-primary-bg);
  border-color: #ff527b;
  box-shadow: 0 2px 10px rgba(255, 42, 95, 0.4);
}

/* Level Select in HUD */
.level-select {
  font-size: 0.92rem;
  font-weight: 700;
  padding: 5px 8px;
  border: var(--theme-border-width) solid var(--theme-border-color);
  background: var(--theme-box-bg);
  color: var(--theme-text);
  border-radius: var(--theme-radius-sm);
  max-width: 175px;
  outline: none;
  cursor: pointer;
}

.level-select option {
  background: #161a24;
  color: #f0f4fc;
}

/* Tab Navigation */
.game-nav {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.nav-tab {
  flex: 1;
  padding: 9px 4px;
  font-size: 0.96rem;
  font-weight: 800;
  border: var(--theme-border-width) solid var(--theme-border-color);
  background: var(--theme-tab-inactive-bg);
  color: var(--theme-tab-inactive-color);
  cursor: pointer;
  text-align: center;
  border-radius: var(--theme-radius-sm);
  transition: all 0.15s ease;
  letter-spacing: 0.3px;
}

.nav-tab.active {
  background: var(--theme-tab-active-bg);
  color: var(--theme-tab-active-color);
  border-color: var(--theme-accent);
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.45);
  transform: translateY(-1px);
}

/* Stage & Container */
.game-stage {
  flex: 1;
  overflow-y: auto;
  position: relative;
}

.game-module-card {
  background: var(--theme-panel-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: var(--theme-panel-shadow);
  padding: 14px;
  border-radius: var(--theme-radius);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Module 1: Recognition & Sentence Cockpit Box */
.sentence-container {
  background: var(--theme-box-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: var(--theme-box-shadow);
  padding: 15px;
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.65;
  border-radius: var(--theme-radius-sm);
  color: var(--theme-text);
}

.target-blank {
  color: var(--theme-accent);
  background: rgba(0, 229, 255, 0.12);
  padding: 2px 10px;
  border: 2px dashed var(--theme-accent);
  border-radius: 6px;
  display: inline-block;
  min-width: 52px;
  text-align: center;
  transition: all 0.15s ease;
  text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.option-btn {
  min-height: 68px;
  font-size: 2rem;
  font-weight: 800;
  background: var(--theme-btn-option-bg);
  color: var(--theme-btn-option-color);
  border: var(--theme-border-width) solid var(--theme-btn-option-border);
  box-shadow: var(--theme-btn-shadow);
  cursor: pointer;
  border-radius: var(--theme-radius-sm);
  transition: transform 0.1s ease, background-color 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
}

.option-btn:active {
  transform: translate(1px, 2px);
  filter: brightness(1.15);
}

.option-btn.correct {
  background: #0a3622 !important;
  color: #00ff66 !important;
  border-color: #00ff66 !important;
  box-shadow: 0 0 16px rgba(0, 255, 102, 0.5) !important;
}

.option-btn.wrong {
  background: #3d1218 !important;
  color: #ff6b85 !important;
  border-color: #ff2a5f !important;
  opacity: 0.65;
}

/* Karaoke Highlighting on Option Buttons & Target Blank */
.option-btn.story-highlight,
.target-blank.story-highlight {
  background: #ffd600 !important;
  color: #0c0e14 !important;
  font-weight: 900 !important;
  border-color: #ffaa00 !important;
  box-shadow: 0 0 16px rgba(255, 214, 0, 0.85) !important;
  transform: scale(1.03);
}

/* Module 2: Handwriting Tuning Workshop */
.handwriting-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.char-info-box {
  background: var(--theme-box-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  padding: 6px 16px;
  text-align: center;
  border-radius: var(--theme-radius-sm);
}

.char-info-box h2 {
  font-size: 2.3rem;
  color: var(--theme-accent);
  line-height: 1.1;
  text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
}

.handwriting-canvas-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #11151f;
  border: 2px solid var(--theme-accent);
  box-shadow: 0 0 14px rgba(0, 229, 255, 0.2);
  margin: 6px auto;
  border-radius: var(--theme-radius-sm);
  overflow: hidden;
  touch-action: none;
}

/* Module 3: Story & Karaoke Highlighting */
.story-box {
  background: var(--theme-box-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  padding: 14px;
  max-height: 250px;
  overflow-y: auto;
  font-size: 1.25rem;
  line-height: 1.8;
  border-radius: var(--theme-radius-sm);
  color: var(--theme-text);
}

.story-char-span {
  display: inline;
  transition: background-color 0.12s ease, color 0.12s ease;
  border-radius: 3px;
  padding: 1px 2px;
}

.story-char-span.story-highlight {
  background: #ffd600 !important;
  color: #0c0e14 !important;
  font-weight: 900 !important;
  box-shadow: 0 0 10px rgba(255, 214, 0, 0.8);
}

/* AI Socratic Pit Crew Companion Box */
.ai-companion-drawer {
  background: #121722;
  border: 2px solid var(--theme-accent);
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 10px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  animation: slideUp 0.25s ease-out;
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
}

.ai-companion-avatar {
  font-size: 1.8rem;
  line-height: 1;
}

.ai-companion-body {
  flex: 1;
}

.ai-companion-title {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--theme-accent);
  margin-bottom: 3px;
}

.ai-companion-text {
  font-size: 1rem;
  color: #e2eafc;
  line-height: 1.45;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.75);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  backdrop-filter: blur(3px);
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background: var(--theme-panel-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85);
  padding: 20px;
  max-width: 500px;
  width: 90%;
  border-radius: var(--theme-radius);
  color: var(--theme-text);
}

.modal-content input {
  background: var(--theme-box-bg);
  color: var(--theme-text);
  border: 2px solid var(--theme-border-color);
  border-radius: 6px;
  outline: none;
}
.modal-content input:focus {
  border-color: var(--theme-accent);
}
</style>
  
  
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
  <div id="game-app">
    <!-- Header HUD -->
    <header class="game-hud">
      <div class="hud-left">
        <h1 class="hud-title" id="app-title">🏎️ Race Master: 極速賽車</h1>
        <button class="hud-badge" id="emerald-count" title="點擊調整分數" style="cursor:pointer;">
          🏆 0
        </button>
      </div>
      <div class="hud-right">
        <button class="hud-btn" id="btn-switch-child">👦 Milo ⇄</button>
        <button class="hud-btn" id="btn-toggle-lang">🗣️ 普通話</button>
        <select class="level-select" id="level-select"></select>
        <button class="hud-btn" id="btn-sync-cloud" title="同步雲端題庫與作答">☁️</button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="game-nav">
      <button class="nav-tab active" data-module="recognition">🏎️ 極速超車</button>
      <button class="nav-tab" data-module="handwriting">🔧 改裝車間</button>
      <button class="nav-tab" data-module="reading">🏁 賽道風雲榜</button>
    </nav>

    <!-- Main Game Stage -->
    <main class="game-stage" id="game-stage">
      <div style="text-align:center; padding:40px; font-size:1.2rem;">正在載入關卡內容...</div>
    </main>
  </div>

  <!-- Parent Score Adjustment Modal -->
  <div class="modal-overlay" id="parent-modal">
    <div class="modal-content">
      <h3 style="font-size:1.3rem; margin-bottom:10px;">👑 家長專用：獎盃調整</h3>
      <p style="font-size:0.95rem; margin-bottom:12px; color:var(--theme-text-muted, #8e9bb5);">您可以手動微調孩子的獎盃獎勵數量：</p>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:14px;">
        <label for="input-emerald" style="font-weight:bold;">🏆 獎盃數量：</label>
        <input type="number" id="input-emerald" style="padding:6px; font-size:1.1rem; width:100px; border:2px solid #000;">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="hud-btn" id="btn-modal-cancel">取消</button>
        <button class="hud-btn primary" id="btn-modal-save">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- Cloud Sync Status Modal -->
  <div class="modal-overlay" id="sync-modal">
    <div class="modal-content" style="max-width: 480px; width: 90%;">
      <h3 style="font-size:1.3rem; margin-bottom:10px;">☁️ 雲端題庫與同步設定</h3>
      <p id="sync-status-msg" style="font-size:0.95rem; margin-bottom:14px; line-height:1.5;">正在檢查雲端連線...</p>

      <div style="margin: 12px 0; text-align: left; background: var(--theme-box-bg, #e0e0e0); padding: 10px; border: 2px solid #000; border-radius: 4px;">
        <label for="input-webapp-url" style="font-size:0.85rem; font-weight:bold; display:block; margin-bottom:6px; color:var(--theme-text, #f0f4fc);">
          ⚙️ Google Apps Script Web App 網址：
        </label>
        <input type="url" id="input-webapp-url" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%; padding:8px; font-size:0.82rem; border:2px solid #000; box-sizing:border-box; background:#fff; font-family:monospace;">
        <p style="font-size:0.75rem; color:var(--theme-text-muted, #8e9bb5); margin-top:4px;">若您部署了新的 Apps Script，可直接在此貼上並儲存。</p>
      </div>

      <div style="display:flex; justify-content:space-between; gap:8px; margin-top:14px;">
        <button class="hud-btn" id="btn-save-webapp-url">儲存網址並重試</button>
        <button class="hud-btn primary" id="btn-sync-close">確定</button>
      </div>
    </div>
  </div>

  <!-- Load Scripts -->
  <script>
/**
 * Chinese Game 2.0 - Default Curriculum Question Banks
 * Tailored for Milo (intermediate primary) and Ollie (foundation primary).
 * Strictly preserves English names Milo, Ollie, and their friend Bradley.
 */

window.DEFAULT_BANKS = {
  "milo": {
    "childName": "Milo",
    "grade": "進階 (Milo)",
    "levels": [
      {
        "levelId": "milo_lvl_04",
        "date": "2026-10-08",
        "theme": "夏日清溪谷冒險",
        "recognition": [
          {
            "sentence": "在烈日當空的［  ］炎夏日裡，熱浪撲面而來，大家紛紛來到清涼的溪谷避暑。",
            "answer": "炎",
            "options": [
              "炎",
              "炙",
              "火",
              "淡"
            ],
            "hint": "火部，兩火相疊，形容天氣極其炎熱",
            "socraticHint": "「炎」由上下兩個「火」組成，火光炎炎，代表天氣酷熱！"
          },
          {
            "sentence": "Milo 歡快地在溪邊拍打水面，清涼的水花四［  ］，灑滿了石灘。",
            "answer": "濺",
            "options": [
              "濺",
              "淺",
              "賤",
              "踐"
            ],
            "hint": "水部（氵），指液體受衝擊向四處飛射",
            "socraticHint": "「濺」是三點水旁，指液體向四周飛灑，不要選成深淺的「淺」囉！"
          },
          {
            "sentence": "山風徐徐吹過，樹林深處飄來陣陣［  ］香，令人心曠神怡。",
            "answer": "幽",
            "options": [
              "幽",
              "曲",
              "幼",
              "悠"
            ],
            "hint": "山部，指清淡、幽微而深遠的香氣",
            "socraticHint": "「幽香」形容清淡雅緻的香氣，「幽」字帶有深邃微遠的意境。"
          },
          {
            "sentence": "走在長滿青苔的濕滑石階上，Milo 小心翼［  ］地邁著腳步，生怕滑倒。",
            "answer": "翼",
            "options": [
              "翼",
              "冀",
              "異",
              "翌"
            ],
            "hint": "羽部，形容言行極其謹慎嚴肅，不敢絲毫疏忽",
            "socraticHint": "「小心翼翼」的「翼」是羽部，像飛鳥斂翅般小心謹慎！"
          },
          {
            "sentence": "看見小動物陷入湍急漩渦的險境，勇敢的 Milo ［  ］身而出，立刻伸手營救。",
            "answer": "挺",
            "options": [
              "挺",
              "廷",
              "艇",
              "庭"
            ],
            "hint": "手部（扌），指勇敢直立向前，主動承擔困難",
            "socraticHint": "「挺身而出」的「挺」是提手旁，代表直起腰桿、勇敢站出來！"
          },
          {
            "sentence": "面對同伴突如其來的誤會，缺乏人證的 Milo 一時百口莫［  ］，不知從何解釋。",
            "answer": "辯",
            "options": [
              "辯",
              "辨",
              "辮",
              "辦"
            ],
            "hint": "言部，代表用言語來辯解與說明",
            "socraticHint": "「辯」的中間是「言」，代表用言語說明原委；不要和辨認的「辨」混淆喔！"
          },
          {
            "sentence": "好心救小鴨卻被誤會玩水弄濕衣服，Milo 委屈得［  ］悶不樂，坐在一旁沈默不語。",
            "answer": "悶",
            "options": [
              "悶",
              "門",
              "問",
              "聞"
            ],
            "hint": "門部（心部），心被關在門裡，形容心情煩悶不快",
            "socraticHint": "「悶」是門裡放了一顆「心」，形容心裡堵得慌、不高興！"
          },
          {
            "sentence": "徒步走了一整天的山路並完成救援，大家雙腿發酸，顯得疲［  ］不堪。",
            "answer": "憊",
            "options": [
              "憊",
              "備",
              "憑",
              "德"
            ],
            "hint": "心部，上備下心，形容極度疲累、困乏",
            "socraticHint": "「憊」是心部，指身心極度疲乏困頓，注意不要寫成防備的「備」！"
          }
        ],
        "handwriting": [
          {
            "char": "辯",

/**
 * Chinese Game 2.0 - Data Adapter
 * Bridges the frontend engine with Google Sheets / Apps Script Web App and local caching.
 * Hardened with safeStorage to prevent DOMException crashes in restricted storage runtimes.
 */

(function(window) {
  'use strict';

  const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwn7Lf8a2x0U-EHnLb5e5uMtIVtfSRsd_VZla7IbFxLpYFzq8u-A2YUrimdLGtywPOd/exec';

  const memoryStore = {};
  const safeStorage = {
    getItem(key, fallback = null) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? val : (memoryStore[key] !== undefined ? memoryStore[key] : fallback);
      } catch (e) {
        return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
      }
    },
    setItem(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        memoryStore[key] = String(value);
      }
    }
  };

  class DataAdapter {
    constructor() {
      this.webAppUrl = safeStorage.getItem('cg_webapp_url', DEFAULT_WEB_APP_URL);
    }

    setWebAppUrl(url) {
      if (url) {
        this.webAppUrl = url.trim();
        safeStorage.setItem('cg_webapp_url', this.webAppUrl);
      }
    }

    getLevels(child) {
      const childKey = (child || 'milo').toLowerCase();
      try {
        const cached = safeStorage.getItem(`cg_cloud_bank_${childKey}`);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && Array.isArray(parsed.levels) && parsed.levels.length > 0) {
            return parsed.levels;
          }
        }
      } catch (e) {
        console.warn('Failed reading cloud cache, using default banks:', e);
      }

      // Fallback to default hardcoded bank
      if (window.DEFAULT_BANKS && window.DEFAULT_BANKS[childKey]) {
        return window.DEFAULT_BANKS[childKey].levels || [];
      }
      return [];
    }

    async fetchCloudQuestions(child, onSuccess, onError) {
      const childKey = (child || 'milo').toLowerCase();
      if (!this.webAppUrl) {
        if (onError) onError('No WebApp URL configured');
        return;
      }

      const fetchUrl = `${this.webAppUrl}?action=getQuestions&child=${childKey}&t=${Date.now()}`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);

        const resp = await fetch(fetchUrl, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (resp.ok) {
          const data = await resp.json();
          if (data && data.levels && data.levels.length > 0) {
            safeStorage.setItem(`cg_cloud_bank_${childKey}`, JSON.stringify(data));
            if (onSuccess) onSuccess(data.levels);
            return;
          }
        }
        throw new Error('Invalid response structure');
      } catch (err) {
        console.warn('Direct fetch failed, falling back to JSONP:', err);
        this.fetchWithJSONP(childKey, onSuccess, onError);
      }
    }

    fetchWithJSONP(childKey, onSuccess, onError) {
      const cbName = `cg_cb_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
      const script = document.createElement('script');

      let timer = setTimeout(() => {
        cleanup();
        if (onError) onError('JSONP Timeout');
      }, 7000);

      const cleanup = () => {
        if (timer) clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      window[cbName] = (data) => {
        cleanup();
        if (data && data.levels && data.levels.length > 0) {
          safeStorage.setItem(`cg_cloud_bank_${childKey}`, JSON.stringify(data));
          if (onSuccess) onSuccess(data.levels);
        } else if (onError) {
          const detail = (data && (data.message || data.error)) ? (data.message || JSON.stringify(data.error)) : 'Empty levels from JSONP';
          onError(detail);
        }
      };

      script.src = `${this.webAppUrl}?action=getQuestions&child=${childKey}&callback=${cbName}&t=${Date.now()}`;
      script.onerror = () => {
        cleanup();
        if (onError) onError('JSONP network error');
      };
      document.head.appendChild(script);
    }

    logRecord(record) {
      const queue = this.getOfflineQueue();
      queue.push(record);
      this.saveOfflineQueue(queue);

      this.flushOfflineQueue();
    }

    getOfflineQueue() {
      try {
        const val = safeStorage.getItem('cg_offline_records');
        return val ? JSON.parse(val) : [];
      } catch (e) {
        return [];
      }
    }

    saveOfflineQueue(queue) {
      try {
        safeStorage.setItem('cg_offline_records', JSON.stringify(queue));
      } catch (e) {}
    }

    async flushOfflineQueue() {
      const queue = this.getOfflineQueue();
      if (!queue.length || !this.webAppUrl) return;

      const recordToSync = queue[0];
      try {
        await fetch(this.webAppUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(recordToSync)
        });

        // Remove sent record
        queue.shift();
        this.saveOfflineQueue(queue);

        // Continue sending if more exist
        if (queue.length > 0) {
          setTimeout(() => this.flushOfflineQueue(), 300);
        }
      } catch (e) {
        console.warn('Offline flush postponed:', e);
      }
    }
  }

  window.DataAdapter = new DataAdapter();
})(window);

        return;

      // 自動將關卡按照日期由新到舊排序，保證最新發布的題目永遠排在第一位 (Index 0)
      this.levels = [...levels].sort((a, b) => {
        const dateA = a.date || '';
        const dateB = b.date || '';
        if (dateB !== dateA) {
          return dateB.localeCompare(dateA); // 日期較新者在前
        }
        const idA = a.levelId || '';
        const idB = b.levelId || '';
        return idB.localeCompare(idA); // 編號較大者在前
      });

      // 每次開啟遊戲或載入題庫時，預設自動選取最新關卡 (Index 0)
      this.currentLevelIndex = 0;
      this.renderLevelDropdown();
      if (this.activeModuleId && this.modules[this.activeModuleId]) {
        this.switchModule(this.activeModuleId);
      }
    }

    getCurrentLevel() {
      if (this.levels.length === 0) return null;
      return this.levels[this.currentLevelIndex] || this.levels[0];
    }

    selectLevel(index) {
      if (this.activeModuleId && this.modules[this.activeModuleId]?.cleanup) {
        this.modules[this.activeModuleId].cleanup();
      }
      this.currentLevelIndex = Math.max(0, Math.min(index, this.levels.length - 1));
      this.hideSocraticHint();
      if (this.activeModuleId) {
        this.switchModule(this.activeModuleId);
      }
    }

    renderLevelDropdown() {
      const select = document.getElementById('level-select');
      if (!select) return;
      select.innerHTML = '';
      this.levels.forEach((lvl, idx) => {

        opt.value = idx;
        const tag = (idx === 0) ? ' ★ 最新' : '';
        opt.textContent = `${lvl.date || ''} ${lvl.theme || '關卡' + (idx + 1)}${tag}`;
        select.appendChild(opt);
      });
      select.value = this.currentLevelIndex;
    }

    showToast(message, duration = 2500) {
      let toast = document.getElementById('engine-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'engine-toast';
        toast.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:6px; font-size:0.95rem; font-weight:bold; z-index:99999; box-shadow:0 4px 14px rgba(0,0,0,0.4); border:2px solid #5c8e32; pointer-events:none; transition:opacity 0.25s ease; opacity:0;';

      const titleEl = document.getElementById('app-title');

        titleEl.textContent = this.activeChild === 'milo' ? '🏎️ Milo 極速賽車' : '🏎️ Ollie 極速賽車';

      const emeraldEl = document.getElementById('emerald-count');

    triggerSocraticHint(context) {

      const titleEl = drawer.querySelector('.ai-companion-title');
      const textEl = drawer.querySelector('.ai-companion-text');

      titleEl.textContent = `🎧 車隊工程師提點 (${context.char || context.target || '賽道分析'})`;
      textEl.textContent = context.hint || '試著觀察部首的形狀和意思，想一想它和哪個部首有關聯喔！';

      drawer.style.display = 'flex';
      this.playTone(440, 0.15); // Friendly chime
    }

    hideSocraticHint() {
      const drawer = document.getElementById('ai-companion-drawer');
      if (drawer) drawer.style.display = 'none';
    }

    // Answer logging to Google Sheets via DataAdapter
    recordAnswer(record) {
      const fullRecord = {
        timestamp: new Date().toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' }),
        child: this.activeChild === 'milo' ? 'Milo' : 'Ollie',
        levelId: this.getCurrentLevel()?.levelId || 'lvl',
        ...record
      };
      if (window.DataAdapter) {
        window.DataAdapter.logRecord(fullRecord);
      }
    }
  }

  window.GameEngine = GameEngine;
})(window);

/**

(function(window) {
  'use strict';

  class RecognitionModule {
    constructor() {

      this.questions = [];
      this.attempts = 0;
      this.isProcessing = false;
      this.isReadingPrompt = false;
      this.promptFallbackTimer = null;
      this.confirmFallbackTimer = null;

    render(container, levelData) {
      this.cleanup();
      this.container = container;
      this.questions = levelData?.recognition || [];
      this.currentIndex = 0;
      this.renderQuestion();

    cleanup() {
      this.stopQuestionRead();

      this.container.innerHTML = `

              <button class="hud-btn" id="btn-stop-rec-q" style="font-size:0.85rem; padding:4px 8px; display:none;">⏹️ 停止</button>

          <div id="ai-companion-drawer" class="ai-companion-drawer" style="display:none;">

      // Read question & options audio button
      const readBtn = document.getElementById('btn-read-rec-q');
      const stopBtn = document.getElementById('btn-stop-rec-q');

      readBtn.addEventListener('click', () => {

      stopBtn.addEventListener('click', () => {

      // Bind option button events

    startQuestionRead(q, options, readBtn, stopBtn) {

      if (readBtn) readBtn.style.display = 'none';

      // Build spoken text and character index map
      let spokenText = '';
      const spanMap = [];
      let cIdx = 0;
      const blankIndex = q.sentence.indexOf('［  ］');

      if (blankIndex !== -1) {
        const before = q.sentence.slice(0, blankIndex);
        const after = q.sentence.slice(blankIndex + 4);
        for (const ch of before) {
          spokenText += ch;
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
        // Blank spoken as '什麼'
        spokenText += '什麼';
        spanMap.push('target-blank');
        spanMap.push('target-blank');
        for (const ch of after) {
          spokenText += ch;
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
      } else {
        for (const ch of q.sentence) {
          spokenText += ch;
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
      }

      spokenText += '。選項有：';
      for (let i = 0; i < 5; i++) spanMap.push(null);

      options.forEach((opt, oIdx) => {
        if (oIdx > 0) {
          spokenText += '、';

        for (const ch of opt) {

      spokenText += '。';

      const highlightElement = (targetId) => {

      const utterance = new SpeechSynthesisUtterance(spokenText);

      let timerIdx = 0;

      utterance.onboundary = (e) => {
        boundaryFired = true;
        if (this.promptFallbackTimer) {
          clearInterval(this.promptFallbackTimer);
          this.promptFallbackTimer = null;
        }
        if (e.charIndex !== undefined && spanMap[e.charIndex] !== undefined) {
          highlightElement(spanMap[e.charIndex]);
        }
      };

      // iOS WebKit Fallback timer
      this.promptFallbackTimer = setInterval(() => {
        if (boundaryFired) {
          clearInterval(this.promptFallbackTimer);
          return;
        }
        if (timerIdx < spanMap.length) {
          highlightElement(spanMap[timerIdx]);

          blank.style.borderColor = '#00ff66';
          blank.style.color = '#00ff66';
        }

        const emeralds = (this.attempts === 1) ? 1 : 0.5;

        this.engine.recordAnswer({

            hint: q.socraticHint || `正確字是「${q.answer}」。注意它的字形與語境：「${q.hint || ''}」！`
          });

          // Reveal answer after 2 attempts
          const blank = document.getElementById('target-blank');
          if (blank) {
            blank.textContent = q.answer;
            blank.style.background = '#3d1218';
            blank.style.borderColor = '#ff2a5f';
            blank.style.color = '#ff6b85';
          }

          this.engine.recordAnswer({
            module: '礦洞選字',
            question: q.sentence,
            userAnswer: selected,
            correctAnswer: q.answer,
            result: '兩次皆錯',
            attempts: this.attempts,
            emerald: 0,
            weakTag: '⚠️ 需加強'
          });

          setTimeout(() => {
            this.speakConfirmationSentence(q.sentence, q.answer, () => {
              setTimeout(() => {

                this.renderQuestion();
              }, 800);
            });

              this.isQuizCompleted = true;
              this.engine.playSuccessSound();
              const feedback = document.getElementById('hw-feedback-msg');
              if (feedback) feedback.textContent = '🌟 太棒了！筆順描寫完成，請點擊下方完成按鈕！';
            }
          });
          this.currentWriter.quiz();
          return;
        } catch (e) {
          console.warn('HanziWriter init failed, falling back to local canvas:', e);
        }
      }

      // Offline HTML5 Canvas Fallback
      this.setupOfflineCanvas(container, cur.char, sz);
    }

    setupOfflineCanvas(container, char, sz) {
      this.currentWriter = null;
      const canvas = document.createElement('canvas');
      canvas.width = sz;
      canvas.height = sz;
      container.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      this.offlineDrawingCtx = ctx;

      // Draw rice-grid (米字格)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(sz / 2, 0); ctx.lineTo(sz / 2, sz);
      ctx.moveTo(0, sz / 2); ctx.lineTo(sz, sz / 2);
      ctx.moveTo(0, 0); ctx.lineTo(sz, sz);
      ctx.moveTo(sz, 0); ctx.lineTo(0, sz);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw watermark character outline
      ctx.font = `${sz * 0.75}px 'Kaiti SC', 'STKaiti', serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f0f0f0';
      ctx.fillText(char, sz / 2, sz / 2 + 10);

      // Drawing state
      let isDrawing = false;
      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const start = (e) => {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.strokeStyle = '#1a5fb4';
        ctx.lineWidth = sz / 20;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        this.offlineStrokeCount++;
      };

      const stop = () => { isDrawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stop);
    }

    handleCompleteChar(cur, isCapped, btnEl) {
      if (this.isTransitioning) return;

      const feedback = document.getElementById('hw-feedback-msg');

      // Exploitation prevention gate: Must verify valid writing if not capped
      if (!isCapped) {
        if (this.currentWriter !== null && !this.isQuizCompleted) {
          this.engine.playErrorSound();
          if (feedback) feedback.textContent = '⚠️ 請先依照筆順完成描寫，再點擊領取冠軍獎盃喔！';
          return;
        }
        if (this.currentWriter === null && this.offlineStrokeCount < 5) {
          this.engine.playErrorSound();
          if (feedback) feedback.textContent = '⚠️ 請在米字格上認真描寫漢字後再送出喔！';
          return;
        }
      }

      this.isTransitioning = true;
      btnEl.disabled = true;

      const levelId = this.engine.getCurrentLevel()?.levelId || 'lvl';
      const capKey = `${levelId}_${cur.char}`;
      const earnedCount = this.engine.state.hwEarnedCounts[capKey] || 0;

      if (!isCapped) {
        this.engine.state.hwEarnedCounts[capKey] = earnedCount + 1;
        this.engine.saveState();
        this.engine.addEmeralds(1);

        this.engine.recordAnswer({
          module: '合成台練字',
          question: `書寫漢字【${cur.char}】`,
          userAnswer: cur.char,
          correctAnswer: cur.char,
          result: '第一次答對',
          attempts: 1,
          emerald: 1,
          weakTag: '✅ 已掌握'
        });
      } else {
        this.engine.playSuccessSound();
      }

      this.engine.speakText(cur.char, () => {
        setTimeout(() => {
          this.currentIndex++;
          this.renderChar();
        }, 400);
      });
    }

    renderCompletion() {
      this.container.innerHTML = `
        <div class="game-module-card" style="text-align:center; padding: 24px;">
          <h2 style="font-size:2rem; margin-bottom:12px;">🏁 賽車改裝完畢！引擎調校達到最高馬力！</h2>
          <p style="font-size:1.2rem; margin-bottom:16px;">各項零件皆已精準調校到位，賽車已達到極限競速狀態！</p>
          <button class="hud-btn primary" id="btn-next-module-reading" style="font-size:1.2rem; padding:10px 24px;">
            前往「賽道風雲榜」🏁
          </button>
        </div>
      `;
      document.getElementById('btn-next-module-reading').addEventListener('click', () => {
        this.engine.switchModule('reading');
      });
    }
  }

  window.HandwritingModule = HandwritingModule;
})(window);

/**
 * Module 3: 村莊冒險日記 (Reading Comprehension & Karaoke Highlighting)
 * Pluggable activity module.
 * Enhanced with synchronized real-time karaoke highlighting for story, QA question, and options.
 */

(function(window) {
  'use strict';

  class ReadingModule {
    constructor() {
      this.storyData = null;
      this.currentQIndex = 0;
      this.isReading = false;
      this.storyFallbackTimer = null;
      this.qaFallbackTimer = null;
      this.attempts = 0;
      this.isProcessing = false;
      this.isReadingQA = false;
    }

    render(container, levelData) {
      this.cleanup();
      this.container = container;
      this.storyData = levelData?.story || null;
      this.currentQIndex = 0;
      this.isReading = false;
      this.isProcessing = false;
      this.isReadingQA = false;
      this.renderView();
    }

    cleanup() {
      if (this.storyFallbackTimer) {
        clearInterval(this.storyFallbackTimer);
        this.storyFallbackTimer = null;
      }
      if (this.qaFallbackTimer) {
        clearInterval(this.qaFallbackTimer);
        this.qaFallbackTimer = null;
      }
      this.isReading = false;
      this.isProcessing = false;
      this.isReadingQA = false;
      this.clearAllHighlights();
    }

    clearAllHighlights() {
      const highlighted = document.querySelectorAll('.story-highlight');
      highlighted.forEach(el => el.classList.remove('story-highlight'));
    }

    renderView() {
      if (!this.storyData) {
        this.container.innerHTML = `<div class="game-module-card"><p>本關卡暫無閱讀篇章。</p></div>`;
        return;
      }

      const storyText = this.storyData.content || '';
      const questions = this.storyData.questions || [];
      const hasQA = questions.length > 0;

      // Wrap each character in span for karaoke highlighting
      let charIndex = 0;
      const wrappedStory = storyText.split('').map(ch => {
        const span = `<span id="story-char-${charIndex}" class="story-char-span">${ch}</span>`;
        charIndex++;
        return span;
      }).join('');

      this.container.innerHTML = `
        <div class="game-module-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="hud-badge" style="font-size:0.95rem;">🏁 ${this.storyData.title || '賽事報告'}</span>
            <div style="display:flex; gap:6px;">
              <button class="hud-btn primary" id="btn-read-story">🔊 朗讀故事</button>
              <button class="hud-btn" id="btn-stop-story" style="display:none;">⏹️ 停止</button>
            </div>
          </div>

          <div class="story-box" id="story-text-container">
            ${wrappedStory}
          </div>

          <div id="qa-container" style="margin-top:10px;">
            ${hasQA ? `<div id="qa-active-question"></div>` : `<p style="text-align:center;">閱讀完畢！請點擊上方朗讀跟讀練習。</p>`}
          </div>
        </div>
      `;

      // Story audio buttons
      const readBtn = document.getElementById('btn-read-story');
      const stopBtn = document.getElementById('btn-stop-story');

      readBtn.addEventListener('click', () => {
        this.startKaraokeRead(storyText, readBtn, stopBtn);
      });

      stopBtn.addEventListener('click', () => {
        this.stopKaraokeRead(readBtn, stopBtn);
      });

      if (hasQA) {
        this.renderQAQuestion(questions);
      }
    }

    startKaraokeRead(text, readBtn, stopBtn) {
      if (!('speechSynthesis' in window)) return;
      this.engine.cancelSpeech();
      this.clearAllHighlights();

      this.isReading = true;
      if (readBtn) readBtn.style.display = 'none';
      if (stopBtn) stopBtn.style.display = 'inline-block';

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = this.engine.speechLang;
      utterance.rate = 0.85;

      let boundaryFired = false;
      let timerIdx = 0;

      const highlightChar = (idx) => {
        this.clearAllHighlights();
        const el = document.getElementById(`story-char-${idx}`);
        if (el) {
          el.classList.add('story-highlight');
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      };

      utterance.onboundary = (e) => {
        boundaryFired = true;
        if (this.storyFallbackTimer) {
          clearInterval(this.storyFallbackTimer);
          this.storyFallbackTimer = null;
        }
        if (e.charIndex !== undefined) {
          highlightChar(e.charIndex);
        }
      };

      // iOS WebKit Fallback timer
      this.storyFallbackTimer = setInterval(() => {
        if (boundaryFired) {
          clearInterval(this.storyFallbackTimer);
          return;
        }
        if (timerIdx < text.length) {
          highlightChar(timerIdx);
          timerIdx++;
        } else {
          clearInterval(this.storyFallbackTimer);
        }
      }, 310);

      const onFinish = () => {
        this.stopKaraokeRead(readBtn, stopBtn);
      };

      utterance.onend = onFinish;
      utterance.onerror = onFinish;

      window.speechSynthesis.speak(utterance);
    }

    stopKaraokeRead(readBtn, stopBtn) {
      this.isReading = false;
      if (this.storyFallbackTimer) {
        clearInterval(this.storyFallbackTimer);
        this.storyFallbackTimer = null;
      }
      this.engine.cancelSpeech();
      this.clearAllHighlights();

      if (readBtn) readBtn.style.display = 'inline-block';
      if (stopBtn) stopBtn.style.display = 'none';
    }

    renderQAQuestion(questions) {
      const qaContainer = document.getElementById('qa-active-question');
      if (!qaContainer) return;

      if (this.currentQIndex >= questions.length) {
        qaContainer.innerHTML = `
          <div style="text-align:center; padding: 14px; background:#e8f5e9; border:2px solid #4caf50; border-radius:4px;">
            <h3>🌟 閱讀理解測驗全數通過！</h3>
            <p style="margin-top:4px;">已精熟掌握故事重點與文意脈絡！</p>
          </div>
        `;
        return;
      }

      this.attempts = 0;
      this.isProcessing = false;
      this.isReadingQA = false;
      const q = questions[this.currentQIndex];

      // Wrap question characters in spans for karaoke highlighting
      let qHtml = '';
      for (let i = 0; i < q.question.length; i++) {
        qHtml += `<span id="qa-q-char-${i}" class="story-char-span">${q.question[i]}</span>`;
      }

      // Shuffle options with answer rotation
      const options = [...q.options];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      qaContainer.innerHTML = `
        <div style="background:#f0f0f0; border:2px solid #000; padding:10px; border-radius:4px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px;">
            <div style="font-weight:bold; font-size:1.15rem;">
              ❓ 問題 ${this.currentQIndex + 1} / ${questions.length}: ${qHtml}
            </div>
            <div style="display:flex; gap:6px;">
              <button class="hud-btn" id="btn-read-qa-q" style="font-size:0.85rem; padding:4px 8px;">🔊 朗讀問題與選項</button>
              <button class="hud-btn" id="btn-stop-qa-q" style="font-size:0.85rem; padding:4px 8px; display:none;">⏹️ 停止</button>
            </div>
          </div>
          <div class="options-grid">
            ${options.map((opt, oIdx) => `
              <button class="option-btn qa-opt-btn" id="qa-opt-${oIdx}" data-val="${opt}" style="font-size:1.15rem; min-height:50px;">
                ${opt}
              </button>
            `).join('')}
          </div>
        </div>
      `;

      // Read QA audio buttons
      const readQABtn = document.getElementById('btn-read-qa-q');
      const stopQABtn = document.getElementById('btn-stop-qa-q');

      readQABtn.addEventListener('click', () => {
        this.startQAQuestionRead(q, options, readQABtn, stopQABtn);
      });

      stopQABtn.addEventListener('click', () => {
        this.stopQAQuestionRead(readQABtn, stopQABtn);
      });

      qaContainer.querySelectorAll('.qa-opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          this.stopQAQuestionRead(readQABtn, stopQABtn);
          this.handleQAAnswer(btn.dataset.val, btn, q, questions);
        });
      });
    }

    startQAQuestionRead(q, options, readBtn, stopBtn) {
      if (!('speechSynthesis' in window)) return;
      this.engine.cancelSpeech();
      this.clearAllHighlights();

      this.isReadingQA = true;
      if (readBtn) readBtn.style.display = 'none';
      if (stopBtn) stopBtn.style.display = 'inline-block';

      // Build spoken text and character index map
      let spokenText = '';
      const spanMap = [];

      for (let i = 0; i < q.question.length; i++) {
        spokenText += q.question[i];
        spanMap.push(`qa-q-char-${i}`);
      }

      spokenText += '。選項有：';
      for (let i = 0; i < 5; i++) spanMap.push(null);

      options.forEach((opt, oIdx) => {
        if (oIdx > 0) {
          spokenText += '；';
          spanMap.push(null);
        }
        for (const ch of opt) {
          spokenText += ch;
          spanMap.push(`qa-opt-${oIdx}`);
        }
      });
      spokenText += '。';
      spanMap.push(null);

      const highlightElement = (targetId) => {
        this.clearAllHighlights();
        if (!targetId) return;
        const el = document.getElementById(targetId);
        if (el) {
          el.classList.add('story-highlight');
          if (el.scrollIntoView) {
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }
      };

      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = this.engine.speechLang;
      utterance.rate = 0.85;

      let boundaryFired = false;
      let timerIdx = 0;

      utterance.onboundary = (e) => {
        boundaryFired = true;
        if (this.qaFallbackTimer) {
          clearInterval(this.qaFallbackTimer);
          this.qaFallbackTimer = null;
        }
        if (e.charIndex !== undefined && spanMap[e.charIndex] !== undefined) {
          highlightElement(spanMap[e.charIndex]);
        }
      };

      // iOS WebKit Fallback timer
      this.qaFallbackTimer = setInterval(() => {
        if (boundaryFired) {
          clearInterval(this.qaFallbackTimer);
          return;
        }
        if (timerIdx < spanMap.length) {
          highlightElement(spanMap[timerIdx]);
          timerIdx++;
        } else {
          clearInterval(this.qaFallbackTimer);
        }
      }, 310);

      const onFinish = () => {
        this.stopQAQuestionRead(readBtn, stopBtn);
      };

      utterance.onend = onFinish;
      utterance.onerror = onFinish;

      window.speechSynthesis.speak(utterance);
    }

    stopQAQuestionRead(readBtn, stopBtn) {
      this.isReadingQA = false;
      if (this.qaFallbackTimer) {
        clearInterval(this.qaFallbackTimer);
        this.qaFallbackTimer = null;
      }
      this.engine.cancelSpeech();
      this.clearAllHighlights();

      const rBtn = readBtn || document.getElementById('btn-read-qa-q');
      const sBtn = stopBtn || document.getElementById('btn-stop-qa-q');
      if (rBtn) rBtn.style.display = 'inline-block';
      if (sBtn) sBtn.style.display = 'none';
    }

    handleQAAnswer(selected, btnEl, q, questions) {
      if (this.isProcessing) return;

      this.attempts++;
      const isCorrect = (selected === q.answer);

      if (isCorrect) {
        this.isProcessing = true;
        this.clearAllHighlights();
        // Disable all buttons immediately to prevent duplicate clicks
        const allBtns = this.container.querySelectorAll('.qa-opt-btn');
        allBtns.forEach(b => b.disabled = true);

        btnEl.classList.add('correct');
        this.engine.playSuccessSound();

        const emeralds = (this.attempts === 1) ? 1 : 0.5;
        this.engine.addEmeralds(emeralds);

        this.engine.recordAnswer({
          module: '冒險日記',
          question: q.question,
          userAnswer: selected,
          correctAnswer: q.answer,
          result: this.attempts === 1 ? '第一次答對' : '第二次答對',
          attempts: this.attempts,
          emerald: emeralds,
          weakTag: '✅ 已掌握'
        });

        setTimeout(() => {
          this.currentQIndex++;
          this.renderQAQuestion(questions);
        }, 800);

      } else {
        btnEl.classList.add('wrong');
        btnEl.disabled = true;
        this.engine.playErrorSound();

        if (this.attempts >= 2) {
          this.isProcessing = true;
          this.clearAllHighlights();
          const allBtns = this.container.querySelectorAll('.qa-opt-btn');
          allBtns.forEach(b => b.disabled = true);

          this.engine.triggerSocraticHint({
            char: '閱讀理解',
            hint: `答案在故事裡哦！試著重讀故事找出關於「${q.question}」的描寫！`
          });

          this.engine.recordAnswer({
            module: '冒險日記',
            question: q.question,
            userAnswer: selected,
            correctAnswer: q.answer,
            result: '兩次皆錯',
            attempts: this.attempts,
            emerald: 0,
            weakTag: '⚠️ 需加強'
          });

          setTimeout(() => {
            this.currentQIndex++;
            this.renderQAQuestion(questions);
          }, 1600);
        }
      }
    }
  }

  window.ReadingModule = ReadingModule;
})(window);

</script>
  
  
  
  
  

  <!-- Application Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Initialize Engine
      const engine = new window.GameEngine();
      window.engine = engine;
  // Global AudioContext unlocker on first touch for iPad WebKit
  const unlockAudioContext = () => {
    if (window.engine) window.engine.initAudio();
    window.removeEventListener('touchstart', unlockAudioContext, true);
    window.removeEventListener('touchend', unlockAudioContext, true);
    window.removeEventListener('click', unlockAudioContext, true);
  };
  window.addEventListener('touchstart', unlockAudioContext, true);
  window.addEventListener('touchend', unlockAudioContext, true);
  window.addEventListener('click', unlockAudioContext, true);


      // 2. Register Activity Modules
      engine.registerModule('recognition', new window.RecognitionModule());
      engine.registerModule('handwriting', new window.HandwritingModule());
      engine.registerModule('reading', new window.ReadingModule());

      // 3. Load Questions from DataAdapter
      const levels = window.DataAdapter.getLevels(engine.activeChild);
      engine.loadLevels(levels);
      engine.switchModule('recognition');
      engine.updateHUD();

      // 4. Background Cloud Update Attempt
      window.DataAdapter.fetchCloudQuestions(engine.activeChild, (newLevels) => {
        console.log('Successfully fetched fresh questions from cloud:', newLevels);
        engine.loadLevels(newLevels);
        engine.showToast && engine.showToast('☁️ 已自動同步並跳轉至今日最新關卡！');
      }, (err) => {
        console.log('Using cached/offline questions:', err);
      });

      // 5. Wire Event Handlers
      // Profile Switch
      document.getElementById('btn-switch-child').addEventListener('click', () => {
        const next = engine.activeChild === 'milo' ? 'ollie' : 'milo';
        engine.setChild(next);
      });

      // Dialect Toggle (Mandarin / Cantonese)
      document.getElementById('btn-toggle-lang').addEventListener('click', () => {
        engine.toggleSpeechDialect();
      });

      // Level Dropdown
      document.getElementById('level-select').addEventListener('change', (e) => {
        engine.selectLevel(parseInt(e.target.value, 10));
      });

      // Navigation Tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          engine.switchModule(tab.dataset.module);
        });
      });

      // Cloud Sync Button
      const syncModal = document.getElementById('sync-modal');
      const syncMsg = document.getElementById('sync-status-msg');
      const webAppInput = document.getElementById('input-webapp-url');

      const triggerSync = () => {
        syncMsg.textContent = '正在自 Google Drive / 試算表拉取最新關卡...';
        window.DataAdapter.fetchCloudQuestions(engine.activeChild, (newLevels) => {
          engine.loadLevels(newLevels);
          syncMsg.textContent = `✅ 同步成功！已載入 ${newLevels.length} 個最新關卡。`;
          window.DataAdapter.flushOfflineQueue();
        }, (err) => {
          syncMsg.textContent = `ℹ️ 目前使用本機離線題庫 (${err})。作答紀錄已在背景暫存，稍後聯網將自動同步。`;
        });
      };

      document.getElementById('btn-sync-cloud').addEventListener('click', () => {
        if (webAppInput) webAppInput.value = window.DataAdapter.webAppUrl || '';
        syncModal.classList.add('active');
        triggerSync();
      });

      document.getElementById('btn-save-webapp-url').addEventListener('click', () => {
        if (webAppInput && webAppInput.value.trim()) {
          window.DataAdapter.setWebAppUrl(webAppInput.value.trim());
          triggerSync();
        }
      });

      document.getElementById('btn-sync-close').addEventListener('click', () => {
        syncModal.classList.remove('active');
      });

      // Parent Emerald Modal
      const parentModal = document.getElementById('parent-modal');
      document.getElementById('emerald-count').addEventListener('click', () => {
        document.getElementById('input-emerald').value = engine.state.emeralds[engine.activeChild] || 0;
        parentModal.classList.add('active');
      });

      document.getElementById('btn-modal-cancel').addEventListener('click', () => {
        parentModal.classList.remove('active');
      });

      document.getElementById('btn-modal-save').addEventListener('click', () => {
        const val = parseInt(document.getElementById('input-emerald').value, 10);
        if (!isNaN(val)) {
          engine.state.emeralds[engine.activeChild] = val;
          engine.saveState();
          engine.updateHUD();
        }
        parentModal.classList.remove('active');
      });

      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('Service Worker registration skipped:', err);
        });
      }
    });
  </script>
