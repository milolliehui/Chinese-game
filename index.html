<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Race Master: 中文極速賽車 2.0</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <style>
/* ==========================================================================
   Race Master 3D - High-Octane Educational Game Theme & Layout Engine
   ========================================================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}

:root {
  --theme-name: "racemaster";
  
  /* Backgrounds: Dark Asphalt & Carbon Chassis */
  --theme-bg: #0c0e14;              /* Deep tarmac black */
  --theme-panel-bg: #161a24;        /* Dark carbon chassis */
  --theme-box-bg: #1e2433;          /* Cockpit telemetry card */
  
  /* Borders & Radii */
  --theme-border-color: #2b3345;    /* Titanium seam */
  --theme-border-width: 2px;
  --theme-radius: 12px;             /* Aerodynamic curves */
  --theme-radius-sm: 8px;

  /* Typography */
  --theme-text: #f0f4fc;            /* Crisp cockpit white */
  --theme-text-muted: #8e9bb5;      /* Telemetry secondary gray */
  --theme-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "PingFang HK", "Microsoft YaHei", sans-serif;

  /* High-Octane Neon Accents */
  --theme-accent: #00e5ff;          /* Nitro Cyan */
  --theme-trophy: #ffcc00;          /* Podium Gold */
  --theme-speed: #ff2a5f;           /* Hot Racing Red */
  --theme-nitro: #00ff66;           /* Turbo Lime Green */

  /* Shadows & Depth */
  --theme-panel-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --theme-box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);

  /* Buttons */
  --theme-btn-bg: #262e40;
  --theme-btn-color: #ffffff;
  --theme-btn-shadow: 0 3px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  --theme-btn-primary-bg: #ff2a5f;

  /* HUD & Badges */
  --theme-badge-bg: #080a0f;
  --theme-badge-color: #ffcc00;

  /* Navigation Tabs */
  --theme-tab-inactive-bg: #191e2b;
  --theme-tab-inactive-color: #8e9bb5;
  --theme-tab-active-bg: #00e5ff;
  --theme-tab-active-color: #080a0f;

  /* Option Buttons */
  --theme-btn-option-bg: #222938;
  --theme-btn-option-color: #f0f4fc;
  --theme-btn-option-border: #38435c;
}

body {
  font-family: var(--theme-font);
  background: var(--theme-bg);
  color: var(--theme-text);
  height: 100vh;
  overflow: hidden;
  margin: 0;
  padding: 0;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 100% 100%, 32px 32px, 32px 32px;
}

#game-app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 920px;
  margin: 0 auto;
  padding: max(env(safe-area-inset-top, 0px) + 12px, 40px) 12px max(env(safe-area-inset-bottom, 0px), 12px) 12px;
}

/* Header & HUD */
.game-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: var(--theme-panel-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: var(--theme-panel-shadow);
  margin-bottom: 8px;
  border-radius: var(--theme-radius);
  position: relative;
}

.hud-left, .hud-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-title {
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: var(--theme-accent);
  text-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
  display: flex;
  align-items: center;
  gap: 4px;
}

.hud-badge {
  background: var(--theme-badge-bg);
  color: var(--theme-badge-color);
  font-size: 1.05rem;
  font-weight: 800;
  padding: 4px 10px;
  border: var(--theme-border-width) solid var(--theme-border-color);
  border-radius: var(--theme-radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
}

.hud-btn {
  background: var(--theme-btn-bg);
  color: var(--theme-btn-color);
  font-size: 0.88rem;
  font-weight: 700;
  padding: 6px 10px;
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: var(--theme-btn-shadow);
  cursor: pointer;
  border-radius: var(--theme-radius-sm);
  transition: transform 0.08s ease, filter 0.08s ease, background 0.12s ease;
  white-space: nowrap;
}

.hud-btn:active {
  transform: translate(1px, 2px);
  filter: brightness(1.15);
}

.hud-btn.primary {
  background: var(--theme-btn-primary-bg);
  border-color: #ff527b;
  box-shadow: 0 2px 10px rgba(255, 42, 95, 0.4);
}

/* Level Select in HUD */
.level-select {
  font-size: 0.92rem;
  font-weight: 700;
  padding: 5px 8px;
  border: var(--theme-border-width) solid var(--theme-border-color);
  background: var(--theme-box-bg);
  color: var(--theme-text);
  border-radius: var(--theme-radius-sm);
  max-width: 175px;
  outline: none;
  cursor: pointer;
}

.level-select option {
  background: #161a24;
  color: #f0f4fc;
}

/* Tab Navigation */
.game-nav {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.nav-tab {
  flex: 1;
  padding: 9px 4px;
  font-size: 0.96rem;
  font-weight: 800;
  border: var(--theme-border-width) solid var(--theme-border-color);
  background: var(--theme-tab-inactive-bg);
  color: var(--theme-tab-inactive-color);
  cursor: pointer;
  text-align: center;
  border-radius: var(--theme-radius-sm);
  transition: all 0.15s ease;
  letter-spacing: 0.3px;
}

.nav-tab.active {
  background: var(--theme-tab-active-bg);
  color: var(--theme-tab-active-color);
  border-color: var(--theme-accent);
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.45);
  transform: translateY(-1px);
}

/* Stage & Container */
.game-stage {
  flex: 1;
  overflow-y: auto;
  position: relative;
}

.game-module-card {
  background: var(--theme-panel-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: var(--theme-panel-shadow);
  padding: 14px;
  border-radius: var(--theme-radius);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Module 1: Recognition & Sentence Cockpit Box */
.sentence-container {
  background: var(--theme-box-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: var(--theme-box-shadow);
  padding: 15px;
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.65;
  border-radius: var(--theme-radius-sm);
  color: var(--theme-text);
}

.target-blank {
  color: var(--theme-accent);
  background: rgba(0, 229, 255, 0.12);
  padding: 2px 10px;
  border: 2px dashed var(--theme-accent);
  border-radius: 6px;
  display: inline-block;
  min-width: 52px;
  text-align: center;
  transition: all 0.15s ease;
  text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.option-btn {
  min-height: 68px;
  font-size: 2rem;
  font-weight: 800;
  background: var(--theme-btn-option-bg);
  color: var(--theme-btn-option-color);
  border: var(--theme-border-width) solid var(--theme-btn-option-border);
  box-shadow: var(--theme-btn-shadow);
  cursor: pointer;
  border-radius: var(--theme-radius-sm);
  transition: transform 0.1s ease, background-color 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
}

.option-btn:active {
  transform: translate(1px, 2px);
  filter: brightness(1.15);
}

.option-btn.correct {
  background: #0a3622 !important;
  color: #00ff66 !important;
  border-color: #00ff66 !important;
  box-shadow: 0 0 16px rgba(0, 255, 102, 0.5) !important;
}

.option-btn.wrong {
  background: #3d1218 !important;
  color: #ff6b85 !important;
  border-color: #ff2a5f !important;
  opacity: 0.65;
}

/* Karaoke Highlighting on Option Buttons & Target Blank */
.option-btn.story-highlight,
.target-blank.story-highlight {
  background: #ffd600 !important;
  color: #0c0e14 !important;
  font-weight: 900 !important;
  border-color: #ffaa00 !important;
  box-shadow: 0 0 16px rgba(255, 214, 0, 0.85) !important;
  transform: scale(1.03);
}

/* Module 2: Handwriting Tuning Workshop */
.handwriting-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.char-info-box {
  background: var(--theme-box-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  padding: 6px 16px;
  text-align: center;
  border-radius: var(--theme-radius-sm);
}

.char-info-box h2 {
  font-size: 2.3rem;
  color: var(--theme-accent);
  line-height: 1.1;
  text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
}

.handwriting-canvas-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #11151f;
  border: 2px solid var(--theme-accent);
  box-shadow: 0 0 14px rgba(0, 229, 255, 0.2);
  margin: 6px auto;
  border-radius: var(--theme-radius-sm);
  overflow: hidden;
  touch-action: none;
}

/* Module 3: Story & Karaoke Highlighting */
.story-box {
  background: var(--theme-box-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  padding: 14px;
  max-height: 250px;
  overflow-y: auto;
  font-size: 1.25rem;
  line-height: 1.8;
  border-radius: var(--theme-radius-sm);
  color: var(--theme-text);
}

.story-char-span {
  display: inline;
  color: inherit;
  transition: background-color 0.12s ease, color 0.12s ease;
  border-radius: 3px;
  padding: 1px 2px;
}

.story-char-span.story-highlight {
  background: #ffd600 !important;
  color: #0c0e14 !important;
  font-weight: 900 !important;
  box-shadow: 0 0 10px rgba(255, 214, 0, 0.8);
}

/* Module 3: QA Question Card & Options (HIGH CONTRAST & CLEAR READABILITY) */
.qa-box {
  background: #1a2233 !important;      /* Deep navy contrast card */
  color: #ffffff !important;           /* Pure white text */
  border: 2px solid #00e5ff !important; /* Nitro Cyan border */
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
  padding: 14px;
  border-radius: 10px;
}

.qa-question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}

.qa-question-title {
  font-weight: 800;
  font-size: 1.25rem;
  line-height: 1.6;
  color: #ffffff !important;           /* High contrast against card */
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  flex: 1;
}

.qa-question-title .story-char-span {
  color: #ffffff !important;           /* Characters in question stay white */
}

.qa-question-title .story-char-span.story-highlight {
  background: #ffd600 !important;
  color: #0c0e14 !important;           /* Highlighted characters */
  font-weight: 900 !important;
}

.qa-opt-btn {
  font-size: 1.18rem !important;
  min-height: 58px !important;
  padding: 10px 14px !important;
  text-align: center;
  line-height: 1.45;
  background: #252e42 !important;
  color: #f0f4fc !important;
  border: 2px solid #384561 !important;
  border-radius: 8px !important;
}

.qa-opt-btn:active {
  background: #2f3b54 !important;
}

.qa-opt-btn.correct {
  background: #0a3622 !important;
  color: #00ff66 !important;
  border-color: #00ff66 !important;
}

.qa-opt-btn.wrong {
  background: #3d1218 !important;
  color: #ff6b85 !important;
  border-color: #ff2a5f !important;
}

.qa-completion-box {
  text-align: center;
  padding: 18px 14px;
  background: #11291f;
  border: 2px solid #00ff66;
  border-radius: 10px;
  color: #e0fde8;
}
.qa-completion-box h3 {
  font-size: 1.4rem;
  color: #00ff66;
  margin-bottom: 6px;
}
.qa-completion-box p {
  font-size: 1.05rem;
  color: #bbf7d0;
}

/* AI Socratic Pit Crew Companion Box */
.ai-companion-drawer {
  background: #121722;
  border: 2px solid var(--theme-accent);
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 10px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  animation: slideUp 0.25s ease-out;
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
}

.ai-companion-avatar {
  font-size: 1.8rem;
  line-height: 1;
}

.ai-companion-body {
  flex: 1;
}

.ai-companion-title {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--theme-accent);
  margin-bottom: 3px;
}

.ai-companion-text {
  font-size: 1rem;
  color: #e2eafc;
  line-height: 1.45;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.75);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  backdrop-filter: blur(3px);
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background: var(--theme-panel-bg);
  border: var(--theme-border-width) solid var(--theme-border-color);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85);
  padding: 20px;
  max-width: 500px;
  width: 90%;
  border-radius: var(--theme-radius);
  color: var(--theme-text);
}

.modal-content input {
  background: #1e2433;
  color: #fff;
  border-color: #38435c;
  border-radius: 6px;
}

.modal-content input:focus {
  border-color: var(--theme-accent);
}
</style>
  
  
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
  <div id="game-app">
    <!-- Header HUD -->
    <header class="game-hud">
      <div class="hud-left">
        <h1 class="hud-title" id="app-title">🏎️ Race Master: 極速賽車</h1>
        <button class="hud-badge" id="emerald-count" title="點擊調整分數" style="cursor:pointer;">🏆 0</button>
      </div>
      <div class="hud-right">
        <button class="hud-btn" id="btn-switch-child">👦 Milo ⇄</button>
        <button class="hud-btn" id="btn-toggle-lang">🗣️ 普通話</button>
        <select class="level-select" id="level-select"></select>
        <button class="hud-btn" id="btn-sync-cloud" title="同步雲端題庫與作答">☁️</button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="game-nav">
      <button class="nav-tab active" data-module="recognition">🏎️ 極速超車</button>
      <button class="nav-tab" data-module="handwriting">🔧 改裝車間</button>
      <button class="nav-tab" data-module="reading">🏁 賽道風雲榜</button>
    </nav>

    <!-- Main Game Stage -->
    <main class="game-stage" id="game-stage">
      <div style="text-align:center; padding:40px; font-size:1.2rem;">正在載入關卡內容...</div>
    </main>
  </div>

  <!-- Parent Score Adjustment Modal -->
  <div class="modal-overlay" id="parent-modal">
    <div class="modal-content">
      <h3 style="font-size:1.3rem; margin-bottom:10px;">👑 家長專用：綠寶石調整</h3>
      <p style="font-size:0.95rem; margin-bottom:12px; color:#444;">您可以手動微調孩子的綠寶石獎勵數量：</p>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:14px;">
        <label for="input-emerald" style="font-weight:bold;">綠寶石數量：</label>
        <input type="number" id="input-emerald" style="padding:6px; font-size:1.1rem; width:100px; border:2px solid #000;">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="hud-btn" id="btn-modal-cancel">取消</button>
        <button class="hud-btn primary" id="btn-modal-save">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- Cloud Sync Status Modal -->
  <div class="modal-overlay" id="sync-modal">
    <div class="modal-content" style="max-width: 480px; width: 90%;">
      <h3 style="font-size:1.3rem; margin-bottom:10px;">☁️ 雲端題庫與同步設定</h3>
      <p id="sync-status-msg" style="font-size:0.95rem; margin-bottom:14px; line-height:1.5;">正在檢查雲端連線...</p>

      <div style="margin: 12px 0; text-align: left; background: var(--theme-box-bg, #e0e0e0); padding: 10px; border: 2px solid #000; border-radius: 4px;">
        <label for="input-webapp-url" style="font-size:0.85rem; font-weight:bold; display:block; margin-bottom:6px; color:#222;">
          ⚙️ Google Apps Script Web App 網址：
        </label>
        <input type="url" id="input-webapp-url" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%; padding:8px; font-size:0.82rem; border:2px solid #000; box-sizing:border-box; background:#fff; font-family:monospace;">
        <p style="font-size:0.75rem; color:#666; margin-top:4px;">若您部署了新的 Apps Script，可直接在此貼上並儲存。</p>
      </div>

      <div style="display:flex; justify-content:space-between; gap:8px; margin-top:14px;">
        <button class="hud-btn" id="btn-save-webapp-url">儲存網址並重試</button>
        <button class="hud-btn primary" id="btn-sync-close">確定</button>
      </div>
    </div>
  </div>

  <!-- Load Scripts -->
  <script>
/**
 * Chinese Game 2.0 - Default Curriculum Question Banks
 * Tailored for Milo (intermediate primary) and Ollie (foundation primary).
 * Strictly preserves English names Milo, Ollie, and their friend Bradley.
 */

window.DEFAULT_BANKS = {
  "milo": {
    "childName": "Milo",
    "grade": "進階 (Milo)",
    "levels": [
      {
        "levelId": "milo_lvl_38",
        "date": "2026-11-13",
        "theme": "礁石潮池探秘紅海葵與斑紋小蟹",
        "recognition": [
          {
            "sentence": "平靜的岩礁潮池裡，一隻背甲長滿彩色斑點的招潮［  ］正舉起大螯巡視領地。",
            "answer": "蟹",
            "options": [
              "蟹",
              "解",
              "角",
              "蟲"
            ],
            "hint": "虫部，指螃蟹、海蟹、青蟹、蟹螯",
            "socraticHint": "「蟹」上面是解，下面是虫，橫著爬行且有堅硬甲殼的甲殼類動物就是蟹！"
          },
          {
            "sentence": "退潮後的金色沙灘上，海浪細細沖刷留下一道道美麗起伏的水波［  ］理。",
            "answer": "紋",
            "options": [
              "紋",
              "文",
              "紊",
              "蚊"
            ],
            "hint": "糸部 (糹)，指紋理、花紋、條紋、波紋",
            "socraticHint": "「紋」左邊是糹字旁，右邊是文，物體表面絲線般的條狀圖案就是花紋、波紋！"
          },
          {
            "sentence": "幾處險峻的海蝕［  ］壁高高聳立在浪花飛濺處，見證著千萬年滄海桑田的變遷。",
            "answer": "岩",
            "options": [
              "岩",
              "山",
              "石",
              "岸"
            ],
            "hint": "山部，上面是山，下面是石，指岩石、岩礁、熔岩、攀岩",
            "socraticHint": "「岩」上面是山，下面是石，海邊堅硬巨大的崖壁就是岩石！"
          },
          {
            "sentence": "幾隻小魚在潮池光滑的礁［  ］縫隙間輕快穿梭，絲毫不受外海猛烈海浪的影響。",
            "answer": "石",
            "options": [
              "石",
              "右",
              "口",
              "百"
            ],
            "hint": "石部，象形字，指石頭、礁石、石塊、石刻",

/**
 * Chinese Game 2.0 - Data Adapter
 * Bridges the frontend engine with Google Sheets / Apps Script Web App and local caching.
 * Hardened with safeStorage to prevent DOMException crashes in restricted storage runtimes.
 */

(function(window) {
  'use strict';

  const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwPJ5v70HVD1NzE4h5YACERpKmIP4DZl9es3hS0u6fQR1I6ySz1Y7DhNJTwH8OgmwWo/exec';

  const memoryStore = {};
  const safeStorage = {
    getItem(key, fallback = null) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? val : (memoryStore[key] !== undefined ? memoryStore[key] : fallback);
      } catch (e) {
        return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
      }
    },
    setItem(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        memoryStore[key] = String(value);
      }
    }
  };

  class DataAdapter {
    constructor() {
      this.webAppUrl = safeStorage.getItem('cg_webapp_url', DEFAULT_WEB_APP_URL);
    }

    setWebAppUrl(url) {
      if (url) {
        this.webAppUrl = url.trim();
        safeStorage.setItem('cg_webapp_url', this.webAppUrl);
      }
    }

    getLevels(child) {
      const childKey = (child || 'milo').toLowerCase();
      try {
        const cached = safeStorage.getItem(`cg_cloud_bank_${childKey}`);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && Array.isArray(parsed.levels) && parsed.levels.length > 0) {
            return parsed.levels;
          }
        }
      } catch (e) {
        console.warn('Failed reading cloud cache, using default banks:', e);
      }

      // Fallback to default hardcoded bank
      if (window.DEFAULT_BANKS && window.DEFAULT_BANKS[childKey]) {
        return window.DEFAULT_BANKS[childKey].levels || [];
      }
      return [];
    }

    async fetchCloudQuestions(child, onSuccess, onError) {
      const childKey = (child || 'milo').toLowerCase();
      if (!this.webAppUrl) {
        if (onError) onError('No WebApp URL configured');
        return;
      }

      const fetchUrl = `${this.webAppUrl}?action=getQuestions&child=${childKey}&t=${Date.now()}`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);

        const resp = await fetch(fetchUrl, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (resp.ok) {
          const data = await resp.json();
          if (data && data.levels && data.levels.length > 0) {
            safeStorage.setItem(`cg_cloud_bank_${childKey}`, JSON.stringify(data));
            if (onSuccess) onSuccess(data.levels);
            return;
          }
        }
        throw new Error('Invalid response structure');
      } catch (err) {
        console.warn('Direct fetch failed, falling back to JSONP:', err);
        this.fetchWithJSONP(childKey, onSuccess, onError);
      }
    }

    fetchWithJSONP(childKey, onSuccess, onError) {
      const cbName = `cg_cb_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
      const script = document.createElement('script');

      let timer = setTimeout(() => {
        cleanup();
        if (onError) onError('JSONP Timeout');
      }, 7000);

      const cleanup = () => {
        if (timer) clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      window[cbName] = (data) => {
        cleanup();
        if (data && data.levels && data.levels.length > 0) {
          safeStorage.setItem(`cg_cloud_bank_${childKey}`, JSON.stringify(data));
          if (onSuccess) onSuccess(data.levels);
        } else if (onError) {
          const detail = (data && (data.message || data.error)) ? (data.message || JSON.stringify(data.error)) : 'Empty levels from JSONP';
          onError(detail);
        }
      };

      script.src = `${this.webAppUrl}?action=getQuestions&child=${childKey}&callback=${cbName}&t=${Date.now()}`;
      script.onerror = () => {
        cleanup();
        if (onError) onError('JSONP network error');
      };
      document.head.appendChild(script);
    }

    logRecord(record) {
      const queue = this.getOfflineQueue();
      queue.push(record);
      this.saveOfflineQueue(queue);

      this.flushOfflineQueue();
    }

    getOfflineQueue() {
      try {
        const val = safeStorage.getItem('cg_offline_records');
        return val ? JSON.parse(val) : [];
      } catch (e) {
        return [];
      }
    }

    saveOfflineQueue(queue) {
      try {
        safeStorage.setItem('cg_offline_records', JSON.stringify(queue));
      } catch (e) {}
    }

    async flushOfflineQueue() {
      const queue = this.getOfflineQueue();
      if (!queue.length || !this.webAppUrl) return;

      const recordToSync = queue[0];
      try {
        await fetch(this.webAppUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(recordToSync)
        });

        // Remove sent record
        queue.shift();
        this.saveOfflineQueue(queue);

        // Continue sending if more exist
        if (queue.length > 0) {
          setTimeout(() => this.flushOfflineQueue(), 300);
        }
      } catch (e) {
        console.warn('Offline flush postponed:', e);
      }
    }
  }

  window.DataAdapter = new DataAdapter();
})(window);

      }
      if (this.audioCtx && this.audioCtx.state === 'suspended') {
        this.audioCtx.resume();
      }

    playTone(freq, duration, type = 'sine') {

        this.initAudio();
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        osc.start();
        osc.stop(this.audioCtx.currentTime + duration);
      } catch (e) {
        // Audio playback error handled silently
      }
    }

      this.playTone(523.25, 0.15); // C5
      setTimeout(() => this.playTone(659.25, 0.2), 120); // E5

    playRewardChime() {
      this.playTone(587.33, 0.1); // D5

      const finish = () => {

          if (onEnd) onEnd();
        }

      utterance.onerror = finish;

      this.levels = [...levels].sort((a, b) => {

        const dateB = b.date || '';
        if (dateB !== dateA) {
          return dateB.localeCompare(dateA); // 日期較新者在前
        }
        const idA = a.levelId || '';
        const idB = b.levelId || '';
        return idB.localeCompare(idA); // 編號較大者在前
      });

      // 每次開啟遊戲或載入題庫時，預設自動選取最新關卡 (Index 0)
      this.currentLevelIndex = 0;
      this.renderLevelDropdown();
      if (this.activeModuleId && this.modules[this.activeModuleId]) {
        this.switchModule(this.activeModuleId);
      }

    getCurrentLevel() {

        this.modules[this.activeModuleId].cleanup();
      }
      this.currentLevelIndex = Math.max(0, Math.min(index, this.levels.length - 1));

      if (this.activeModuleId) {

      }
    }

        opt.textContent = `${lvl.date || ''} ${lvl.theme || '關卡' + (idx + 1)}${tag}`;

      }
      const titleEl = document.getElementById('app-title');
      if (titleEl) {
        titleEl.textContent = this.activeChild === 'milo' ? '🏎️ Milo 極速賽車' : '🏎️ Ollie 極速賽車';

      const emeraldEl = document.getElementById('emerald-count');
      if (emeraldEl) {
        emeraldEl.textContent = `🏆 ${this.state.emeralds[this.activeChild] || 0}`;
      }
      const langBtn = document.getElementById('btn-toggle-lang');
      if (langBtn) {

    // Socratic AI Companion Hook

      if (!drawer) return;
      
      const titleEl = drawer.querySelector('.ai-companion-title');
      const textEl = drawer.querySelector('.ai-companion-text');

      titleEl.textContent = `💡 AI 小幫手的提點 (${context.char || context.target || '字詞啟發'})`;
      textEl.textContent = context.hint || '試著觀察部首的形狀和意思，想一想它和哪個部首有關聯喔！';

      drawer.style.display = 'flex';
      this.playTone(440, 0.15); // Friendly chime
    }

    hideSocraticHint() {
      const drawer = document.getElementById('ai-companion-drawer');
      if (drawer) drawer.style.display = 'none';
    }

    // Answer logging to Google Sheets via DataAdapter
    recordAnswer(record) {
      const curLvl = this.getCurrentLevel();
      const fullRecord = {
        timestamp: new Date().toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' }),
        child: this.activeChild === 'milo' ? 'Milo' : 'Ollie',
        date: curLvl?.date || '',
        levelId: curLvl?.levelId || 'lvl',
        ...record
      };
      if (window.DataAdapter) {
        window.DataAdapter.logRecord(fullRecord);
      }
    }
  }

  window.GameEngine = GameEngine;
})(window);

(function(window) {
  'use strict';

  class RecognitionModule {
    constructor() {

      this.questions = [];

      this.isReadingPrompt = false;
      this.promptFallbackTimer = null;
      this.confirmFallbackTimer = null;

    render(container, levelData) {
      this.cleanup();
      this.container = container;
      this.questions = levelData?.recognition || [];

    cleanup() {
      this.stopQuestionRead();

    clearAllHighlights() {

          sentenceHtml += `<span id="rec-char-${charIdx}" class="story-char-span">${ch}</span>`;
          charIdx++;

          sentenceHtml += `<span id="rec-char-${charIdx}" class="story-char-span">${ch}</span>`;

          charIdx++;

        <div class="game-module-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
            <span class="hud-badge" style="font-size:0.95rem;">🏎️ 極速超車 第 ${this.currentIndex + 1} / ${this.questions.length} 題</span>
            <div style="display:flex; gap:6px; align-items:center;">

              <button class="hud-btn" id="btn-stop-rec-q" style="font-size:0.85rem; padding:4px 8px; display:none;">⏹️ 停止</button>
            </div>
          </div>

          <div class="sentence-container" id="sentence-box">
            ${sentenceHtml}
          </div>

          <div class="options-grid" id="options-grid">

              <button class="option-btn" id="rec-opt-${oIdx}" data-val="${opt}">${opt}</button>

          </div>

          <div id="ai-companion-drawer" class="ai-companion-drawer" style="display:none;">
            <div class="ai-companion-avatar">🦉</div>
            <div class="ai-companion-body">
              <div class="ai-companion-title">AI 小幫手提點</div>
              <div class="ai-companion-text"></div>
            </div>
          </div>
        </div>
      `;

      // Read question & options audio button
      const readBtn = document.getElementById('btn-read-rec-q');
      const stopBtn = document.getElementById('btn-stop-rec-q');

      readBtn.addEventListener('click', () => {

      stopBtn.addEventListener('click', () => {

      // Bind option button events

    startQuestionRead(q, options, readBtn, stopBtn) {

      let spokenText = '';
      const spanMap = [];
      let cIdx = 0;
      const blankIndex = q.sentence.indexOf('［  ］');

      if (blankIndex !== -1) {
        const before = q.sentence.slice(0, blankIndex);
        const after = q.sentence.slice(blankIndex + 4);
        for (const ch of before) {
          spokenText += ch;
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
        // Blank spoken as '什麼'
        spokenText += '什麼';
        spanMap.push('target-blank');
        spanMap.push('target-blank');
        for (const ch of after) {
          spokenText += ch;
          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;
        }
      } else {
        for (const ch of q.sentence) {

          spanMap.push(`rec-char-${cIdx}`);
          cIdx++;

      spokenText += '。選項有：';
      for (let i = 0; i < 5; i++) spanMap.push(null);

      options.forEach((opt, oIdx) => {

        for (const ch of opt) {

      spokenText += '。';

      const highlightElement = (targetId) => {

      let timerIdx = 0;

      utterance.onboundary = (e) => {
        boundaryFired = true;
        if (this.promptFallbackTimer) {
          clearInterval(this.promptFallbackTimer);
          this.promptFallbackTimer = null;

        if (e.charIndex !== undefined && spanMap[e.charIndex] !== undefined) {

      };

          clearInterval(this.promptFallbackTimer);

      if (sBtn) sBtn.style.display = 'none';

          blank.style.borderColor = '#2e7d32';

        this.engine.addEmeralds(emeralds);

            blank.textContent = q.answer;
            blank.style.background = '#ffcdd2';
            blank.style.borderColor = '#c62828';
          }

          this.engine.recordAnswer({
            module: '礦洞選字',
            question: q.sentence,
            userAnswer: selected,
            correctAnswer: q.answer,
            result: '兩次皆錯',
            attempts: this.attempts,
            emerald: 0,
            weakTag: '⚠️ 需加強'
          });

          setTimeout(() => {
            this.speakConfirmationSentence(q.sentence, q.answer, () => {
              setTimeout(() => {
                this.currentIndex++;
                this.renderQuestion();
              }, 800);
            });
          }, 1500);
        }

        }

        }

(function(window) {

        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          y: (clientY - rect.top) * (canvas.height / rect.height)

      canvas.addEventListener('mousemove', draw);

      canvas.addEventListener('touchmove', draw, { passive: false });

    buildStoryParts(storyData) {

      const paragraphs = content.split(/\n\s*\n/).filter(Boolean);
      let part1Text = content;
      let part2Text = '';
      if (paragraphs.length >= 2) {
        const midP = Math.ceil(paragraphs.length / 2);
        part1Text = paragraphs.slice(0, midP).join('\n\n');
        part2Text = paragraphs.slice(midP).join('\n\n');
      } else if (content.length > 60) {
        const midChar = Math.floor(content.length / 2);
        let splitAt = content.indexOf('。', midChar);
        if (splitAt === -1) splitAt = content.lastIndexOf('。', midChar);
        if (splitAt !== -1 && splitAt < content.length - 1) {
          part1Text = content.slice(0, splitAt + 1).trim();
          part2Text = content.slice(splitAt + 1).trim();
        }

      if (!part2Text) {
        return [{ content: part1Text, questions }];
      }
      const midQ = Math.ceil(questions.length / 2);
      return [

        { content: part2Text, questions: questions.slice(midQ) }

          this.renderQAQuestion(questions);
        }, 800);

      } else {
        btnEl.classList.add('wrong');
        btnEl.disabled = true;
        this.engine.playErrorSound();

        if (this.attempts >= 2) {
          this.isProcessing = true;
          this.clearAllHighlights();
          const allBtns = this.container.querySelectorAll('.qa-opt-btn');
          allBtns.forEach(b => b.disabled = true);

          this.engine.triggerSocraticHint({
            char: '閱讀理解',
            hint: `答案在這段故事裡哦！試著重讀故事找出關於「${q.question}」的描寫！`
          });

          this.engine.recordAnswer({
            module: '冒險日記',
            question: q.question,
            userAnswer: selected,
            correctAnswer: q.answer,
            result: '兩次皆錯',
            attempts: this.attempts,
            emerald: 0,
            weakTag: '⚠️ 需加強'
          });

          setTimeout(() => {
            this.currentQIndex++;
            this.renderQAQuestion(questions);
          }, 1600);
        }
      }
    }
  }

  window.ReadingModule = ReadingModule;
})(window);

</script>
  
  
  
  
  

  <!-- Application Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Initialize Engine
      const engine = new window.GameEngine();
      window.engine = engine;

      // 2. Register Activity Modules
      engine.registerModule('recognition', new window.RecognitionModule());
      engine.registerModule('handwriting', new window.HandwritingModule());
      engine.registerModule('reading', new window.ReadingModule());

      // 3. Load Questions from DataAdapter
      const levels = window.DataAdapter.getLevels(engine.activeChild);
      engine.loadLevels(levels);
      engine.switchModule('recognition');
      engine.updateHUD();

      // 4. Background Cloud Update Attempt
      window.DataAdapter.fetchCloudQuestions(engine.activeChild, (newLevels) => {
        console.log('Successfully fetched fresh questions from cloud:', newLevels);
        engine.loadLevels(newLevels);
        engine.showToast && engine.showToast('☁️ 已自動同步並跳轉至今日最新關卡！');
      }, (err) => {
        console.log('Using cached/offline questions:', err);
      });

      // 5. Wire Event Handlers
      // Profile Switch
      document.getElementById('btn-switch-child').addEventListener('click', () => {
        const next = engine.activeChild === 'milo' ? 'ollie' : 'milo';
        engine.setChild(next);
      });

      // Dialect Toggle (Mandarin / Cantonese)
      document.getElementById('btn-toggle-lang').addEventListener('click', () => {
        engine.toggleSpeechDialect();
      });

      // Level Dropdown
      document.getElementById('level-select').addEventListener('change', (e) => {
        engine.selectLevel(parseInt(e.target.value, 10));
      });

      // Navigation Tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          engine.switchModule(tab.dataset.module);
        });
      });

      // Cloud Sync Button
      const syncModal = document.getElementById('sync-modal');
      const syncMsg = document.getElementById('sync-status-msg');
      const webAppInput = document.getElementById('input-webapp-url');

      const triggerSync = () => {
        syncMsg.textContent = '正在自 Google Drive / 試算表拉取最新關卡...';
        window.DataAdapter.fetchCloudQuestions(engine.activeChild, (newLevels) => {
          engine.loadLevels(newLevels);
          syncMsg.textContent = `✅ 同步成功！已載入 ${newLevels.length} 個最新關卡。`;
          window.DataAdapter.flushOfflineQueue();
        }, (err) => {
          syncMsg.textContent = `ℹ️ 目前使用本機離線題庫 (${err})。作答紀錄已在背景暫存，稍後聯網將自動同步。`;
        });
      };

      document.getElementById('btn-sync-cloud').addEventListener('click', () => {
        if (webAppInput) webAppInput.value = window.DataAdapter.webAppUrl || '';
        syncModal.classList.add('active');
        triggerSync();
      });

      document.getElementById('btn-save-webapp-url').addEventListener('click', () => {
        if (webAppInput && webAppInput.value.trim()) {
          window.DataAdapter.setWebAppUrl(webAppInput.value.trim());
          triggerSync();
        }
      });

      document.getElementById('btn-sync-close').addEventListener('click', () => {
        syncModal.classList.remove('active');
      });

      // Parent Emerald Modal
      const parentModal = document.getElementById('parent-modal');
      document.getElementById('emerald-count').addEventListener('click', () => {
        document.getElementById('input-emerald').value = engine.state.emeralds[engine.activeChild] || 0;
        parentModal.classList.add('active');
      });

      document.getElementById('btn-modal-cancel').addEventListener('click', () => {
        parentModal.classList.remove('active');
      });

      document.getElementById('btn-modal-save').addEventListener('click', () => {
        const val = parseInt(document.getElementById('input-emerald').value, 10);
        if (!isNaN(val)) {
          engine.state.emeralds[engine.activeChild] = val;
          engine.saveState();
          engine.updateHUD();
        }
        parentModal.classList.remove('active');
      });

      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('Service Worker registration skipped:', err);
        });
      }
    });
  </script>
</body>
</html>
